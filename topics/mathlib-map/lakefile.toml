name = "MathlibMap"
version = "0.1.0"
defaultTargets = ["MathlibMap"]

# Links between the core library's definitions (../../lean-library, core Lean) and Mathlib's.
# Same Lean and Mathlib versions as ../../lean-library-mathlib.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[require]]
name = "FusedAlgebra"
path = "../../lean-library"

[[lean_lib]]
name = "MathlibMap"
