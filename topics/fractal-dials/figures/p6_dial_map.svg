<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Map of fractal dials against the dials mult-add already has" xmlns:c2pa="http://c2pa.org/manifest"><title>Map of fractal dials against the dials mult-add already has</title><rect width="900" height="560" fill="#fff"/><g style="font-family:Inter,system-ui,sans-serif"><text x="20.0" y="30.0" font-size="15" fill="#15131a" text-anchor="start" font-weight="600">Which fractal dials mult-add already has</text><text x="30.0" y="64.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="600">fractal dial</text><text x="380.0" y="64.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="600">in mult-add</text><text x="740.0" y="64.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="600">status</text><rect x="20.00" y="78.00" width="860.00" height="52.00" rx="6" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="78.00" width="6.00" height="52.00" rx="2" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="109.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">dimension d</text><text x="380.0" y="109.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">fractional mult-add power (1+a)^d</text><text x="740.0" y="109.0" font-size="12" fill="#1d2bd8" text-anchor="start" font-weight="700">has it</text><rect x="20.00" y="140.00" width="860.00" height="52.00" rx="6" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="140.00" width="6.00" height="52.00" rx="2" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="171.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">weights p : 1−p (multifractal D_q, f(α))</text><text x="380.0" y="171.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">per-element dial t = p/(1−p)</text><text x="740.0" y="171.0" font-size="12" fill="#1d2bd8" text-anchor="start" font-weight="700">has it</text><rect x="20.00" y="202.00" width="860.00" height="52.00" rx="6" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="202.00" width="6.00" height="52.00" rx="2" fill="#1d2bd8" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="233.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">branching growth (how fast branching grows)</text><text x="380.0" y="233.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">rung flow at t = ½ (half-exponential)</text><text x="740.0" y="233.0" font-size="12" fill="#1d2bd8" text-anchor="start" font-weight="700">has it, separately</text><rect x="20.00" y="264.00" width="860.00" height="52.00" rx="6" fill="#b7791f" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="264.00" width="6.00" height="52.00" rx="2" fill="#b7791f" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="295.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">wobble / complex dimensions</text><text x="380.0" y="295.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">a phase that turns with zoom; like twist or a Clifford rotor</text><text x="740.0" y="295.0" font-size="12" fill="#b7791f" text-anchor="start" font-weight="700">partial</text><rect x="20.00" y="326.00" width="860.00" height="52.00" rx="6" fill="#cf3519" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="326.00" width="6.00" height="52.00" rx="2" fill="#cf3519" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="357.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">zoom ratio r (how much each piece shrinks)</text><text x="380.0" y="357.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">nothing yet: mult-add has no notion of size</text><text x="740.0" y="357.0" font-size="12" fill="#cf3519" text-anchor="start" font-weight="700">missing: one candidate</text><rect x="20.00" y="388.00" width="860.00" height="52.00" rx="6" fill="#9a98a3" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="388.00" width="6.00" height="52.00" rx="2" fill="#9a98a3" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="419.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">placement: lacunarity, Minkowski content</text><text x="380.0" y="419.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">geometry outside the algebra</text><text x="740.0" y="419.0" font-size="12" fill="#9a98a3" text-anchor="start" font-weight="700">outside</text><rect x="20.00" y="450.00" width="860.00" height="52.00" rx="6" fill="#9a98a3" stroke="none" stroke-width="1" fill-opacity="0.08"/><rect x="20.00" y="450.00" width="6.00" height="52.00" rx="2" fill="#9a98a3" stroke="none" stroke-width="1" fill-opacity="1"/><text x="36.0" y="481.0" font-size="13" fill="#15131a" text-anchor="start" font-weight="600">topology: touching, gluing</text><text x="380.0" y="481.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">silent below d = 1; only matters at d ≥ 1</text><text x="740.0" y="481.0" font-size="12" fill="#9a98a3" text-anchor="start" font-weight="700">outside</text><text x="20.0" y="528.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">If mult-add adds one dial, it is a zoom (size) dial: then dimension stops being an input and comes out of</text><text x="20.0" y="546.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">piece count and zoom, d = log(pieces) / log(1/zoom), via Moran's equation. Everything else is covered or is geometry.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>