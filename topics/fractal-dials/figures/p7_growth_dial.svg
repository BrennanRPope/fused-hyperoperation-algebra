<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Self-similar counts are lines; the power set curves up; a half step needs a growth dial" xmlns:c2pa="http://c2pa.org/manifest"><title>Self-similar counts are lines; the power set curves up; a half step needs a growth dial</title><rect width="900" height="430" fill="#fff"/><g style="font-family:Inter,system-ui,sans-serif"><text x="20.0" y="30.0" font-size="15" fill="#15131a" text-anchor="start" font-weight="600">Why no shape dial gives the natural half step of the power set</text><line x1="80.00" y1="340.00" x2="550.00" y2="340.00" stroke="#15131a" stroke-width="1"/><line x1="80.00" y1="60.00" x2="80.00" y2="340.00" stroke="#15131a" stroke-width="1"/><text x="80.0" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">0</text><text x="158.3" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">1</text><text x="236.7" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">2</text><text x="315.0" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">3</text><text x="393.3" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">4</text><text x="471.7" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">5</text><text x="550.0" y="358.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400">6</text><text x="72.0" y="344.0" font-size="11" fill="#5d5a66" text-anchor="end" font-weight="400">0</text><text x="72.0" y="274.0" font-size="11" fill="#5d5a66" text-anchor="end" font-weight="400">16</text><text x="72.0" y="204.0" font-size="11" fill="#5d5a66" text-anchor="end" font-weight="400">32</text><text x="72.0" y="134.0" font-size="11" fill="#5d5a66" text-anchor="end" font-weight="400">48</text><text x="72.0" y="64.0" font-size="11" fill="#5d5a66" text-anchor="end" font-weight="400">64</text><text x="315.0" y="378.0" font-size="12" fill="#5d5a66" text-anchor="middle" font-weight="400">level n</text><text x="30.0" y="48.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">log₂(count)</text><polyline points="80.0,340.0 158.3,335.6 236.7,331.2 315.0,326.9 393.3,322.5 471.7,318.1 550.0,313.8" fill="none" stroke="#1d2bd8" stroke-width="1.4"/><text x="556.0" y="317.8" font-size="11" fill="#1d2bd8" text-anchor="start" font-weight="400">branching 2</text><polyline points="80.0,340.0 158.3,331.2 236.7,322.5 315.0,313.8 393.3,305.0 471.7,296.2 550.0,287.5" fill="none" stroke="#1d2bd8" stroke-width="1.4"/><text x="556.0" y="297.5" font-size="11" fill="#1d2bd8" text-anchor="start" font-weight="400">branching 4</text><polyline points="80.0,340.0 158.3,322.5 236.7,305.0 315.0,287.5 393.3,270.0 471.7,252.5 550.0,235.0" fill="none" stroke="#1d2bd8" stroke-width="1.4"/><text x="556.0" y="239.0" font-size="11" fill="#1d2bd8" text-anchor="start" font-weight="400">branching 16</text><polyline points="80.0,335.6 87.8,335.3 95.7,335.0 103.5,334.6 111.3,334.2 119.2,333.8 127.0,333.4 134.8,332.9 142.7,332.4 150.5,331.8 158.3,331.2 166.2,330.6 174.0,329.9 181.8,329.2 189.7,328.5 197.5,327.6 205.3,326.7 213.2,325.8 221.0,324.8 228.8,323.7 236.7,322.5 244.5,321.2 252.3,319.9 260.2,318.5 268.0,316.9 275.8,315.3 283.7,313.5 291.5,311.6 299.3,309.5 307.2,307.3 315.0,305.0 322.8,302.5 330.7,299.8 338.5,296.9 346.3,293.8 354.2,290.5 362.0,286.9 369.8,283.1 377.7,279.1 385.5,274.7 393.3,270.0 401.2,265.0 409.0,259.6 416.8,253.8 424.7,247.6 432.5,241.0 440.3,233.9 448.2,226.3 456.0,218.1 463.8,209.4 471.7,200.0 479.5,190.0 487.3,179.2 495.2,167.6 503.0,155.3 510.8,142.0 518.7,127.8 526.5,112.6 534.3,96.2 542.2,78.8 550.0,60.0" fill="none" stroke="#cf3519" stroke-width="2"/><text x="542.0" y="74.0" font-size="11" fill="#cf3519" text-anchor="end" font-weight="400">power set 2^(2ⁿ)</text><polyline points="80.0,337.8 83.9,337.6 87.8,337.4 91.8,337.2 95.7,336.9 99.6,336.7 103.5,336.5 107.4,336.3 111.3,336.1 115.2,335.8 119.2,335.6 123.1,335.5 127.0,335.3 130.9,335.1 134.8,335.0 138.8,334.8 142.7,334.6 146.6,334.4 150.5,334.2 154.4,334.0 158.3,333.8 162.2,333.5 166.2,333.2 170.1,332.9 174.0,332.6 177.9,332.3 181.8,332.0 185.8,331.6 189.7,331.3 193.6,331.1 197.5,330.9 201.4,330.6 205.3,330.4 209.2,330.2 213.2,329.9 217.1,329.7 221.0,329.4 224.9,329.2 228.8,328.9 232.8,328.6 236.7,328.3 240.6,327.9 244.5,327.5 248.4,327.1 252.3,326.7 256.2,326.2 260.2,325.8 264.1,325.4 268.0,324.9 271.9,324.5 275.8,324.0 279.8,323.6 283.7,323.1 287.6,322.6 291.5,322.3 295.4,321.9 299.3,321.6 303.2,321.3 307.2,320.9 311.1,320.6 315.0,320.2 318.9,319.9 322.8,319.5 326.8,319.2 330.7,318.8 334.6,318.4 338.5,318.1 342.4,317.7 346.3,317.3 350.2,316.9 354.2,316.5 358.1,316.1 362.0,315.7 365.9,315.3 369.8,314.9 373.8,314.4 377.7,314.0 381.6,313.6 385.5,313.1 389.4,312.7 393.3,312.2 397.2,311.6 401.2,310.9 405.1,310.2 409.0,309.6 412.9,308.9 416.8,308.2 420.7,307.4 424.7,306.7 428.6,306.0 432.5,305.2 436.4,304.5 440.3,303.7 444.2,302.9 448.2,302.1 452.1,301.3 456.0,300.5 459.9,299.7 463.8,298.9 467.8,298.0 471.7,297.2 475.6,296.3 479.5,295.4 483.4,294.5 487.3,293.6 491.2,292.7 495.2,291.8 499.1,290.9 503.0,289.9 506.9,289.0 510.8,288.0 514.8,287.0 518.7,286.1 522.6,285.1 526.5,284.1 530.4,283.0 534.3,282.0 538.2,281.0 542.2,279.9 546.1,278.8 550.0,277.7" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6,4"/><text x="556.0" y="271.7" font-size="11" fill="#b7791f" text-anchor="start" font-weight="400">a half step</text><text x="690.0" y="80.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">Shape dials (zoom, placement,</text><text x="690.0" y="98.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">weights, gluing) all keep counts</text><text x="690.0" y="116.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">c·bⁿ: straight lines here, and</text><text x="690.0" y="134.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400">joining keeps them straight.</text><text x="690.0" y="152.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400"></text><text x="690.0" y="170.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">The power set's counts 2^(2ⁿ)</text><text x="690.0" y="188.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">curve up and fit no line</text><text x="690.0" y="206.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">(Lean: powerset_not_selfsimilar).</text><text x="690.0" y="224.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400"></text><text x="690.0" y="242.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">A half step must bend between</text><text x="690.0" y="260.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">them: that needs a dial on how</text><text x="690.0" y="278.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">fast branching grows, which is</text><text x="690.0" y="296.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">mult-add's rung flow at t = ½.</text><text x="690.0" y="314.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400"></text><text x="690.0" y="332.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">The dashed curve is one exact half</text><text x="690.0" y="350.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400">step, h(h(n)) = 2ⁿ; there are many.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>