<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-label="Maxwell's four equations are the vector and trivector parts of one equation; charge conservation follows as gravity's energy conservation does" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><rect x="400.0" y="40.0" width="240.0" height="70.0" rx="16" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.14" stroke-width="2"/><text x="520.0" y="86.0" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" stroke="none">∇F = J</text><line x1="470.0" y1="112.0" x2="250.0" y2="170.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)" stroke-opacity="1"/><line x1="570.0" y1="112.0" x2="790.0" y2="170.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)" stroke-opacity="1"/><text x="285.0" y="132.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">vector part</text><text x="760.0" y="132.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">trivector part</text><rect x="60.0" y="175.0" width="380.0" height="110.0" rx="12" stroke="currentColor" fill="none" fill-opacity="1" stroke-width="1.2"/><text x="250.0" y="212.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">∇·E = ρ   (Gauss)</text><text x="250.0" y="248.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">∇×B − ∂E/∂t = J   (Ampère–Maxwell)</text><rect x="600.0" y="175.0" width="380.0" height="110.0" rx="12" stroke="currentColor" fill="none" fill-opacity="1" stroke-width="1.2"/><text x="790.0" y="212.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">∇·B = 0   (no monopoles)</text><text x="790.0" y="248.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">∇×E + ∂B/∂t = 0   (Faraday)</text><rect x="60.0" y="320.0" width="440.0" height="84.0" rx="12" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.1" stroke-width="1.4"/><text x="280.0" y="352.0" text-anchor="middle" font-size="17" font-weight="700" fill="#8fd3ff" stroke="none">∇·J = ⟨∇∇F⟩₀ = 0</text><text x="280.0" y="378.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">charge conservation comes free</text><rect x="540.0" y="320.0" width="440.0" height="84.0" rx="12" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.1" stroke-width="1.4"/><text x="760.0" y="352.0" text-anchor="middle" font-size="17" font-weight="700" fill="#8fd3ff" stroke="none">∇·G = 0 (Bianchi)</text><text x="760.0" y="378.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">gravity's energy conservation comes free</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>