<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-label="A Galilean boost tilts the light lines unevenly; a Lorentz boost squeezes along them and keeps them" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><text x="270.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ff5c8a" stroke="none">Galilean boost (q = 0)</text><line x1="120.0" y1="225.0" x2="420.0" y2="225.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><line x1="270.0" y1="375.0" x2="270.0" y2="75.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="424.0" y="229.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">x</text><text x="276.0" y="71.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">t</text><line x1="135.0" y1="360.0" x2="405.0" y2="90.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="1"/><line x1="405.0" y1="360.0" x2="135.0" y2="90.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="1"/><line x1="270.0" y1="225.0" x2="344.2" y2="90.0" stroke="#ff5c8a" stroke-width="2.4" stroke-opacity="1"/><text x="352.2" y="84.0" text-anchor="start" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">speed c − v</text><line x1="270.0" y1="225.0" x2="135.0" y2="131.9" stroke="#ff5c8a" stroke-width="2.4" stroke-opacity="1"/><text x="127.0" y="125.9" text-anchor="end" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">speed c + v</text><text x="270.0" y="400.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">light lines tilt unevenly: the wave equation gains a cross term</text><text x="770.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#8fd3ff" stroke="none">Lorentz boost (q = −1/c²)</text><line x1="620.0" y1="225.0" x2="920.0" y2="225.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><line x1="770.0" y1="375.0" x2="770.0" y2="75.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="924.0" y="229.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">x</text><text x="776.0" y="71.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">t</text><line x1="635.0" y1="360.0" x2="905.0" y2="90.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="1"/><line x1="905.0" y1="360.0" x2="635.0" y2="90.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="1"/><path d="M770.0 225.0 L811.0 184.0 L770.0 143.0 L729.0 184.0 Z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-dasharray="3 3" stroke-opacity="1"/><path d="M770.0 225.0 L839.7 155.3 L815.6 131.2 L745.9 200.9 Z" stroke="#8fd3ff" stroke-width="2.4" fill="#8fd3ff" fill-opacity=".18" stroke-opacity="1"/><text x="872.1" y="150.9" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">× D</text><text x="717.8" y="176.8" text-anchor="end" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">× 1/D</text><text x="770.0" y="400.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">light lines stay put; areas are kept; D² = (1+v)/(1−v) is the mult-add lift</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>