<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-label="The corner of the lift square splits into a dot part and a wedge part; for the derivative and the potential the wedge part is the field F" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><text x="200.0" y="40.0" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">The lift square (1 + a)(1 + b)</text><rect x="70.0" y="180.0" width="150.0" height="150.0" rx="0" stroke="currentColor" fill="none" fill-opacity="1" stroke-width="1.4"/><text x="145.0" y="260.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">1</text><rect x="220.0" y="180.0" width="110.0" height="150.0" rx="0" stroke="currentColor" fill="none" fill-opacity="1" stroke-width="1.4"/><text x="275.0" y="260.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">a</text><rect x="70.0" y="85.0" width="150.0" height="95.0" rx="0" stroke="currentColor" fill="none" fill-opacity="1" stroke-width="1.4"/><text x="145.0" y="137.5" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">b</text><rect x="220.0" y="85.0" width="110.0" height="95.0" rx="0" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.18" stroke-width="2.2"/><line x1="220.0" y1="180.0" x2="330.0" y2="85.0" stroke="#8fd3ff" stroke-width="1.6" stroke-opacity="1"/><text x="255.2" y="153.4" text-anchor="middle" font-size="14" font-weight="700" fill="#8fd3ff" stroke="none">a·b</text><text x="297.0" y="119.2" text-anchor="middle" font-size="14" font-weight="700" fill="#ffc66b" stroke="none">a∧b</text><text x="200.0" y="360.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">corner ab = a·b (same both orders) + a∧b (flips)</text><line x1="370.0" y1="200.0" x2="470.0" y2="200.0" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar)" stroke-opacity="1"/><text x="420.0" y="188.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">a → ∇, b → A</text><text x="750.0" y="40.0" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">The same split for the potential</text><text x="750.0" y="110.0" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" stroke="none">∇A  =  ∇·A  +  ∇∧A</text><rect x="540.0" y="150.0" width="200.0" height="100.0" rx="12" stroke="#ffc66b" fill="#ffc66b" fill-opacity="0.1" stroke-width="1.4"/><text x="640.0" y="185.0" text-anchor="middle" font-size="18" font-weight="700" fill="#ffc66b" stroke="none">∇·A</text><text x="640.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">a gauge choice</text><text x="640.0" y="230.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">(Lorenz gauge sets it to 0)</text><rect x="780.0" y="150.0" width="200.0" height="100.0" rx="12" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.12" stroke-width="1.4"/><text x="880.0" y="185.0" text-anchor="middle" font-size="18" font-weight="700" fill="#8fd3ff" stroke="none">∇∧A = F</text><text x="880.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">the field: E and B</text><text x="880.0" y="230.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">in one oriented-area object</text><text x="750.0" y="300.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">the order gap of the multivector mult-add is 2 a∧b (Clifford page);</text><text x="750.0" y="322.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">here the wedge part is exactly the field strength</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>