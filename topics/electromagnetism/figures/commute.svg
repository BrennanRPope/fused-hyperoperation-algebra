<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="With commuting phases a loop of constant potentials closes; with non-commuting ones it leaves a gap equal to the commutator" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><text x="270.0" y="36.0" text-anchor="middle" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">U(1): phases commute (mult-add)</text><line x1="180.0" y1="195.0" x2="360.0" y2="195.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="360.0" y1="195.0" x2="360.0" y2="95.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="360.0" y1="95.0" x2="180.0" y2="95.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="180.0" y1="95.0" x2="180.0" y2="191.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><circle cx="180.0" cy="195.0" r="7.0" stroke="#8fd3ff" fill="#8fd3ff" stroke-width="1.5"/><text x="168.0" y="200.0" text-anchor="end" font-size="13" font-weight="400" fill="#8fd3ff" stroke="none">closes</text><text x="270.0" y="270.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">constant potential: no field</text><text x="270.0" y="290.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">F = ∇∧A, field carries no charge: linear</text><text x="780.0" y="36.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ff5c8a" stroke="none">Boosts or Yang–Mills: they don't</text><line x1="690.0" y1="195.0" x2="870.0" y2="195.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="870.0" y1="195.0" x2="870.0" y2="95.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="870.0" y1="95.0" x2="690.0" y2="95.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="690.0" y1="95.0" x2="690.0" y2="157.0" stroke="currentColor" stroke-width="2" marker-end="url(#ar)" stroke-opacity="1"/><line x1="690.0" y1="161.0" x2="690.0" y2="195.0" stroke="#ff5c8a" stroke-width="3" stroke-opacity="1"/><text x="680.0" y="183.0" text-anchor="end" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">gap =</text><text x="680.0" y="201.0" text-anchor="end" font-size="13" font-weight="700" fill="#ff5c8a" stroke="none">[A_x, A_y]</text><text x="780.0" y="270.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">constant potentials still turn the loop</text><text x="780.0" y="290.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">field gains A∧A, carries charge: nonlinear</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>