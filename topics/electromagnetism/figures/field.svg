<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="Under a boost the light-cone parts of the field scale by D and 1/D; the field slides along a hyperbola; a light wave sits on a light line" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><line x1="100.0" y1="250.0" x2="590.0" y2="250.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="596.0" y="254.0" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">E_y</text><line x1="330.0" y1="460.0" x2="330.0" y2="40.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.5"/><text x="336.0" y="36.0" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">B_z</text><line x1="160.3" y1="419.7" x2="525.2" y2="54.8" stroke="#ff5c8a" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="1"/><line x1="160.3" y1="80.3" x2="525.2" y2="445.2" stroke="#ff5c8a" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="1"/><text x="535.0" y="45.0" text-anchor="start" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">E_y = B_z (light wave)</text><text x="535.0" y="465.0" text-anchor="start" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">E_y = −B_z</text><path d="M496.8 380.4 L492.5 374.9 L488.5 369.6 L484.6 364.3 L480.8 359.3 L477.3 354.3 L473.9 349.4 L470.7 344.7 L467.6 340.1 L464.6 335.5 L461.9 331.1 L459.2 326.7 L456.8 322.5 L454.4 318.3 L452.2 314.2 L450.1 310.1 L448.2 306.2 L446.4 302.2 L444.7 298.4 L443.2 294.6 L441.7 290.9 L440.4 287.1 L439.3 283.5 L438.2 279.9 L437.3 276.3 L436.5 272.7 L435.8 269.2 L435.2 265.7 L434.7 262.2 L434.4 258.7 L434.1 255.2 L434.0 251.7 L434.0 248.3 L434.1 244.8 L434.4 241.3 L434.7 237.8 L435.2 234.3 L435.8 230.8 L436.5 227.3 L437.3 223.7 L438.2 220.1 L439.3 216.5 L440.4 212.9 L441.7 209.1 L443.2 205.4 L444.7 201.6 L446.4 197.8 L448.2 193.8 L450.1 189.9 L452.2 185.8 L454.4 181.7 L456.8 177.5 L459.2 173.3 L461.9 168.9 L464.6 164.5 L467.6 159.9 L470.7 155.3 L473.9 150.6 L477.3 145.7 L480.8 140.7 L484.6 135.7 L488.5 130.4 L492.5 125.1 L496.8 119.6" stroke="#8fd3ff" stroke-width="2.2" fill="none" stroke-opacity="1"/><text x="504.8" y="384.4" text-anchor="start" font-size="13" font-weight="400" fill="#8fd3ff" stroke="none">E² − B² fixed</text><circle cx="434.0" cy="250.0" r="6.0" stroke="#8fd3ff" fill="#8fd3ff" stroke-width="1.5"/><text x="446.0" y="242.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">field</text><circle cx="437.7" cy="277.9" r="6.0" stroke="#8fd3ff" fill="#8fd3ff" stroke-width="1.5"/><text x="449.7" y="282.9" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">after one boost</text><circle cx="449.0" cy="307.8" r="6.0" stroke="#8fd3ff" fill="#8fd3ff" stroke-width="1.5"/><text x="461.0" y="312.8" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">after two</text><circle cx="447.7" cy="132.3" r="5.0" stroke="#ff5c8a" fill="#ff5c8a" stroke-width="1.5"/><text x="437.7" y="126.3" text-anchor="end" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">wave</text><circle cx="399.2" cy="180.8" r="5.0" stroke="#ff5c8a" fill="#ff5c8a" stroke-width="1.5"/><text x="389.2" y="174.8" text-anchor="end" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">÷ D</text><circle cx="370.7" cy="209.3" r="5.0" stroke="#ff5c8a" fill="#ff5c8a" stroke-width="1.5"/><text x="360.7" y="203.3" text-anchor="end" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">÷ D²</text><text x="650.0" y="70.0" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">One boost along x does this:</text><text x="650.0" y="110.0" text-anchor="start" font-size="15" font-weight="400" fill="currentColor" stroke="none">E_y + B_z</text><text x="800.0" y="110.0" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">× 1/D</text><text x="650.0" y="154.0" text-anchor="start" font-size="15" font-weight="400" fill="currentColor" stroke="none">E_y − B_z</text><text x="800.0" y="154.0" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">× D</text><text x="650.0" y="198.0" text-anchor="start" font-size="15" font-weight="400" fill="currentColor" stroke="none">their ratio</text><text x="800.0" y="198.0" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">× D² = 1 + d(v)</text><text x="650.0" y="242.0" text-anchor="start" font-size="15" font-weight="400" fill="currentColor" stroke="none">their product</text><text x="800.0" y="242.0" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">unchanged</text><text x="650.0" y="286.0" text-anchor="start" font-size="15" font-weight="400" fill="currentColor" stroke="none">two boosts</text><text x="800.0" y="286.0" text-anchor="start" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">D₁ D₂ (so d's mult-add)</text><text x="650.0" y="350.0" text-anchor="start" font-size="14" font-weight="700" fill="#ff5c8a" stroke="none">A light wave lives on one light line</text><text x="650.0" y="372.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">(null field: E² = B² and E·B = 0). Moving with it,</text><text x="650.0" y="392.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">its amplitude falls by 1/D and its energy</text><text x="650.0" y="412.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">density by 1/D², the inverse mult-add lift.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>