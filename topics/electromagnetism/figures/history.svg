<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="Electromagnetism set the dial, special relativity composed boosts by mult-add, general relativity made the twist local" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><rect x="10.0" y="40.0" width="280.0" height="150.0" rx="16" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.1" stroke-width="1.5"/><text x="150.0" y="70.0" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">1865 Maxwell</text><text x="150.0" y="158.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">waves move at</text><text x="150.0" y="177.0" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">c = 1/√(ε₀μ₀)</text><rect x="380.0" y="40.0" width="280.0" height="150.0" rx="16" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.1" stroke-width="1.5"/><text x="520.0" y="70.0" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">1905 Einstein (special)</text><text x="520.0" y="158.0" text-anchor="middle" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">boosts compose by</text><text x="520.0" y="177.0" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">mult-add (Doppler² lift)</text><rect x="750.0" y="40.0" width="280.0" height="150.0" rx="16" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.1" stroke-width="1.5"/><text x="890.0" y="70.0" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor" stroke="none">1915 Einstein (general)</text><tex