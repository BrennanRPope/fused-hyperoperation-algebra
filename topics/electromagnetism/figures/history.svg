869.2 92.6 L873.0 91.0 L877.1 89.6 L881.4 88.7 L886.0 88.2 L890.5 88.0 L895.1 88.2 L899.6 88.9 L903.9 89.9 L907.9 91.3 L911.7 93.0" stroke="#8fd3ff" stroke-width="2.2" fill="none" marker-end="url(#ar)" stroke-opacity="1"/><text x="942.0" y="100.0" text-anchor="start" font-size="12" font-weight="400" fill="#8fd3ff" stroke="none">turned</text><line x1="295.0" y1="115.0" x2="375.0" y2="115.0" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar)" stroke-opacity="1"/><text x="335.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">sets the dial q = −1/c²</text><line x1="665.0" y1="115.0" x2="745.0" y2="115.0" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar)" stroke-opacity="1"/><text x="705.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">made local</text><text x="705.0" y="134.0" text-anchor="middle" font-size="12" font-weight="400" fill="#b9cbd9" stroke="none">plus a metric</text><rect x="10.0" y="225.0" width="1020.0" height="82.0" rx="14" stroke="#ffc66b" fill="#ffc66b" fill-opacity="0.08" stroke-width="1.2"/><text x="520.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffc66b" stroke="none">shared by electromagnetism and gravity (both are gauge fields)</text><text x="275.0" y="284.0" text-anchor="middle" font-size="14" font-weight="400" fill="currentColor" stroke="none">EM: phase around a loop = charge × flux</text><text x="780.0" y="284.0" text-anchor="middle" font-size="14" font-weight="400" fill="currentColor" stroke="none">gravity: boost around a loop = curvature × area</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>