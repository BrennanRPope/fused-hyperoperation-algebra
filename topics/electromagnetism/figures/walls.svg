<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-label="Born-Infeld's field cap has the same curve as speed against momentum, but its fields do not add by Einstein's rule" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, Noto Sans Math, STIX Two Math, Cambria Math, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><line x1="90.0" y1="320.0" x2="584.0" y2="320.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.6"/><line x1="90.0" y1="320.0" x2="90.0" y2="44.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.6"/><line x1="90.0" y1="80.0" x2="584.0" y2="80.0" stroke="#ff5c8a" stroke-width="1.6" stroke-dasharray="6 4" stroke-opacity="1"/><text x="584.0" y="72.0" text-anchor="end" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">wall: c (speed) or b (field)</text><path d="M90.0 320.0 L94.8 308.0 L99.5 296.1 L104.2 284.4 L109.0 272.9 L113.8 261.8 L118.5 251.0 L123.2 240.7 L128.0 230.9 L132.8 221.5 L137.5 212.7 L142.2 204.3 L147.0 196.5 L151.8 189.2 L156.5 182.4 L161.2 176.0 L166.0 170.1 L170.8 164.6 L175.5 159.4 L180.2 154.7 L185.0 150.3 L189.8 146.2 L194.5 142.4 L199.2 138.9 L204.0 135.6 L208.8 132.6 L213.5 129.8 L218.2 127.1 L223.0 124.7 L227.8 122.4 L232.5 120.3 L237.2 118.3 L242.0 116.5 L246.8 114.8 L251.5 113.1 L256.2 111.6 L261.0 110.2 L265.8 108.9 L270.5 107.6 L275.2 106.4 L280.0 105.3 L284.8 104.3 L289.5 103.3 L294.2 102.4 L299.0 101.5 L303.8 100.7 L308.5 99.9 L313.2 99.2 L318.0 98.5 L322.8 97.8 L327.5 97.2 L332.2 96.6 L337.0 96.0 L341.8 95.5 L346.5 94.9 L351.2 94.4 L356.0 94.0 L360.8 93.5 L365.5 93.1 L370.2 92.7 L375.0 92.3 L379.8 91.9 L384.5 91.6 L389.2 91.3 L394.0 90.9 L398.8 90.6 L403.5 90.3 L408.2 90.0 L413.0 89.8 L417.8 89.5 L422.5 89.2 L427.2 89.0 L432.0 88.8 L436.8 88.5 L441.5 88.3 L446.2 88.1 L451.0 87.9 L455.8 87.7 L460.5 87.5 L465.2 87.3 L470.0 87.2 L474.8 87.0 L479.5 86.8 L484.3 86.7 L489.0 86.5 L493.8 86.4 L498.5 86.2 L503.2 86.1 L508.0 86.0 L512.8 85.8 L517.5 85.7 L522.2 85.6 L527.0 85.5 L531.8 85.4 L536.5 85.3 L541.2 85.1 L546.0 85.0 L550.8 84.9 L555.5 84.8 L560.2 84.8 L565.0 84.7" stroke="#8fd3ff" stroke-width="2.6" fill="none" stroke-opacity="1"/><text x="337.0" y="350.0" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">momentum p  (or Born–Infeld's D/b)</text><text x="80.0" y="200.0" text-anchor="end" font-size="13" font-weight="400" fill="currentColor" stroke="none">v or E/b</text><text x="432.0" y="120.8" text-anchor="middle" font-size="13" font-weight="400" fill="#8fd3ff" stroke="none">v = p/√(1+p²)  and  E = D/√(1+D²/b²)</text><text x="640.0" y="70.0" text-anchor="start" font-size="15" font-weight="700" fill="currentColor" stroke="none">Same wall shape, different rule for adding</text><text x="640.0" y="104.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">Velocities compose by Einstein's rule (mult-add).</text><text x="640.0" y="126.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">Born–Infeld fields compose by adding D (Gauss).</text><text x="640.0" y="162.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">Example, D₁ = 0.8, D₂ = 1.3 (b = 1):</text><text x="640.0" y="204.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">E(D₁ + D₂)</text><rect x="740.0" y="190.0" width="234.8" height="20.0" rx="4" stroke="#8fd3ff" fill="#8fd3ff" fill-opacity="0.5" stroke-width="1"/><text x="982.8" y="205.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">0.9029</text><text x="640.0" y="244.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">E₁ ⊕ E₂</text><rect x="740.0" y="230.0" width="246.5" height="20.0" rx="4" stroke="#ffc66b" fill="#ffc66b" fill-opacity="0.5" stroke-width="1"/><text x="994.5" y="245.0" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">0.9479</text><text x="640.0" y="300.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">Maxwell itself has no wall: its fields add plainly.</text><text x="640.0" y="322.0" text-anchor="start" font-size="13" font-weight="400" fill="#b9cbd9" stroke="none">QED bends that only near 1.3 × 10¹⁸ V/m (Schwinger).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>