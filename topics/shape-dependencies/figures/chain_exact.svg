</style><rect x="40" y="142" width="220" height="96" rx="14" class="box" stroke-width="1.5"/><line x1="70" y1="172" x2="230" y2="172" class="ln" stroke-width="1.5"/><line x1="150" y1="158" x2="150" y2="186" class="bak" stroke-width="5"/><text x="150" y="200" text-anchor="middle" font-size="15" font-weight="700" class="ink">Addition</text><text x="150" y="217" text-anchor="middle" font-size="12.5" class="mut">one double wall (border)</text><text x="150" y="232" text-anchor="middle" font-size="12" class="mut">0 periods: a + b</text><rect x="450" y="142" width="220" height="96" rx="14" class="box" stroke-width="1.5"/><line x1="480" y1="172" x2="640" y2="172" class="ln" stroke-width="1.5"/><line x1="520" y1="160" x2="520" y2="184" class="bak" stroke-width="3"/><line x1="600" y1="160" x2="600" y2="184" class="bak" stroke-width="3"/><text x="560" y="200" text-anchor="middle" font-size="15" font-weight="700" class="ink">Mult-add</text><text x="560" y="217" text-anchor="middle" font-size="12.5" class="mut">two real walls</text><text x="560" y="232" text-anchor="middle" font-size="12" class="mut">1 period: a + b + ab</text><rect x="860" y="142" width="220" height="96" rx="14" class="box" stroke-width="1.5"/><line x1="890" y1="172" x2="1050" y2="172" class="ln" stroke-width="1.5"/><ellipse cx="970" cy="172" rx="34" ry="13" fill="none" class="fwd" stroke-width="2.5"/><ellipse cx="970" cy="170" rx="12" ry="4" fill="none" class="fwd" stroke-width="2"/><text x="970" y="200" text-anchor="middle" font-size="15" font-weight="700" class="ink">Torus law</text><text x="970" y="217" text-anchor="middle" font-size="12.5" class="mut">elliptic curve</text><text x="970" y="232" text-anchor="middle" font-size="12" class="mut">2 periods</text><rect x="450" y="422" width="220" height="96" rx="14" class="box" stroke-width="1.5"/><line x1="480" y1="452" x2="640" y2="452" class="ln" stroke-width="1.5"/><circle cx="560" cy="452" r="14" fill="none" class="fwd" stroke-width="2.5"/><text x="560" y="480" text-anchor="middle" font-size="15" font-weight="700" class="ink">Turning law</text><text x="560" y="497" text-anchor="middle" font-size="12.5" class="mut">no real wall</text><text x="560" y="512" text-anchor="middle" font-size="12" class="mut">slope addition (a+b)/(1−ab)</text><line x1="262" y1="175" x2="446" y2="175" class="fwd" stroke-width="2.6"/><polygon points="446,175 434.9,179.7 434.9,170.3" class="fwdt"/><text x="354.0" y="165.0" text-anchor="middle" font-size="12.5" class="fwdt">add the corner ab</text><text x="354.0" y="149.0" text-anchor="middle" font-size="11" class="mut" font-style="italic">law_is_addition_plus_corner</text><line x1="446" y1="212" x2="262" y2="212" class="bak" stroke-width="2.6" stroke-dasharray="6 4"/><polygon points="262,212 273.1,207.3 273.1,216.7" class="bakt"/><text x="354.0" y="234.0" text-anchor="middle" font-size="12.5" class="bakt">walls merge (limit)</text><text x="354.0" y="249.0" text-anchor="middle" font-size="11" class="mut" font-style="italic">two_walls_difference</text><line x1="672" y1="175" x2="856" y2="175" class="fwd" stroke-width="2.6"/><polygon points="856,175 844.9,179.7 844.9,170.3" class="fwdt"/><text x="764.0" y="165.0" text-anchor="middle" font-size="12.5" class="fwdt">two periods</text><text x="764.0" y="149.0" text-anchor="middle" font-size="11" class="mut" font-style="italic">textbook (theta functions)</text><line x1="856" y1="212" x2="672" y2="212" class="bak" stroke-width="2.6" stroke-dasharray="6 4"/><polygon points="672,212 683.1,207.3 683.1,216.7" class="bakt"/><text x="764.0" y="234.0" text-anchor="middle" font-size="12.5" class="bakt">pinch once: node</text><text x="764.0" y="249.0" text-anchor="middle" font-size="11" class="mut" font-style="italic">nodal_collinear, nodal_phi</text><line x1="560" y1="240" x2="560" y2="420" class="fwd" stroke-width="2.6"/><polygon points="560,420 555.3,408.9 564.7,408.9" class="fwdt"/><text x="560.0" y="320.0" text-anchor="middle" font-size="12.5" class="fwdt"></text><text x="572" y="372" font-size="12.5" class="fwdt">turn by i</text><text x="572" y="388" font-size="11" class="mut" font-style="italic">turn_num, turn_disc</text><path d="M1010,240 C1010,330 190,330 190,240" fill="none" class="bak" stroke-width="2.2" stroke-dasharray="6 4"/><polygon points="183,252 197,252 190,240" class="bakt"/><text x="760" y="334" font-size="12.5" class="bakt">pinch twice: cusp → addition</text><text x="760" y="350" font-size="11" class="mut" font-style="italic">cusp_collinear, cusp_is_addition</text><text x="20" y="30" font-size="18" font-weight="700" class="ink">Zoom: the composition shapes form one clean line, proved</text><text x="20" y="52" font-size="13.5" class="mut">Solid blue: what you need to build the next shape. Red dashed: the limit that takes it back. Lean theorem names in italics (21 theorems, no sorry).</text><text x="20" y="74" font-size="13.5" class="mut">Zooming never changes the shape (zoom_disc), and the border is fixed by the turn (turn_keeps_border).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>