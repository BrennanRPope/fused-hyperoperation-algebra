<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 550" role="img" aria-label="Exact chain of composition shapes" xmlns:c2pa="http://c2pa.org/manifest"><title>Exact chain of composition shapes</title><style>
