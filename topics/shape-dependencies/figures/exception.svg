</style><text x="20" y="30" font-size="18" font-weight="700" class="ink">Zoom: the main exception runs from "any size" down to a stick</text><text x="20" y="52" font-size="13.5" class="mut">43 proofs about one fixed size use a law stated for every size n, then set n. That is specialising, not building.</text><g opacity="0.5"><rect x="94.7" y="164.7" width="30.6" height="30.6" class="b-cube" opacity=".35"/><polygon points="94.7,164.7 102.35000000000001,157.04999999999998 132.95,157.04999999999998 125.3,164.7" class="b-cube" opacity=".6"/><polygon points="125.3,164.7 132.95,157.04999999999998 132.95,187.65 125.3,195.3" class="b-cube"/><rect x="94.7" y="164.7" width="30.6" height="30.6" fill="none" class="s-cube" stroke-width="2"/></g><g opacity="0.75"><rect x="102.7" y="156.7" width="30.6" height="30.6" class="b-cube" opacity=".35"/><polygon points="102.7,156.7 110.35000000000001,149.04999999999998 140.95000000000002,149.04999999999998 133.3,156.7" class="b-cube" opacity=".6"/><polygon points="133.3,156.7 140.95000000000002,149.04999999999998 140.95000000000002,179.65 133.3,187.3" class="b-cube"/><rect x="102.7" y="156.7" width="30.6" height="30.6" fill="none" class="s-cube" stroke-width="2"/></g><g opacity="1"><rect x="110.7" y="148.7" width="30.6" height="30.6" class="b-cube" opacity=".35"/><polygon points="110.7,148.7 118.35000000000001,141.04999999999998 148.95000000000002,141.04999999999998 141.3,148.7" class="b-cube" opacity=".6"/><polygon points="141.3,148.7 148.95000000000002,141.04999999999998 148.95000000000002,171.65 141.3,179.3" class="b-cube"/><rect x="110.7" y="148.7" width="30.6" height="30.6" fill="none" class="s-cube" stroke-width="2"/></g><text x="160" y="204" class="ink" font-size="14" font-style="italic">n</text><line x1="606" y1="170" x2="674" y2="170" class="s-rod" stroke-width="5" stroke-linecap="round"/><text x="120" y="232" text-anchor="middle" font-size="14" font-weight="600" class="ink">a law for every n</text><text x="640" y="232" text-anchor="middle" font-size="14" font-weight="600" class="ink">used at one n</text><line x1="200" y1="170" x2="560" y2="170" class="bak" stroke-width="3" stroke-dasharray="7 5"/><polygon points="560,162 574,170 560,178" class="bakt"/><text x="40" y="280" font-size="12.5" class="ink">nilpotent_weight_inverse</text><text x="330" y="280" font-size="12.5" class="bakt">→</text><text x="360" y="280" font-size="12.5" class="ink">nilpotent_weight_group</text><text x="40" y="296" font-size="11.5" class="mut">wAdd k a (-a * geom (-(k * a)) m) = 0</text><text x="40" y="324" font-size="12.5" class="ink">painted_subsets</text><text x="330" y="324" font-size="12.5" class="bakt">→</text><text x="360" y="324" font-size="12.5" class="ink">alternating_corners</text><text x="40" y="340" font-size="11.5" class="mut">sumL ((groups (List.replicate n k)).map prodL) = (1 + k) ^ n</text><text x="40" y="368" font-size="12.5" class="ink">pow_emod_of</text><text x="330" y="368" font-size="12.5" class="bakt">→</text><text x="360" y="368" font-size="12.5" class="ink">three_dvd_of_cube</text><text x="40" y="384" font-size="11.5" class="mut">x^n % m = ((x % m)^n) % m</text><text x="40" y="412" font-size="12.5" class="ink">frey_disc_pth_power</text><text x="330" y="412" font-size="12.5" class="bakt">→</text><text x="360" y="412" font-size="12.5" class="ink">frey_disc_valuation</text><text x="40" y="428" font-size="11.5" class="mut">256 * Δ = ((a * b * c) ^ 2) ^ p</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>