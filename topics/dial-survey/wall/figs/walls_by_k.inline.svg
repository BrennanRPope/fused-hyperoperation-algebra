<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A line of k values. A pink wall runs along it except at k = minus 1 and plus 1. Copies points minus 1 over m sit below, crowding to 0; Lee–Yang points 1 + 2cos(2 pi over n) sit above, crowding to 3. They meet only at minus 1, 0 and 1." xmlns:c2pa="http://c2pa.org/manifest"><text x="20.0" y="26.0" class="fi" font-size="15" text-anchor="start" font-weight="600">Where the walls sit, and where the Lee–Yang points sit, for each k</text><line x1="24.0" y1="58.0" x2="52.0" y2="58.0" class="sp" stroke-width="7"/><text x="60.0" y="62.0" class="fi" font-size="12" text-anchor="start">wall at Re s = 0</text><path d="M190 54 l-5 -9 h10 z" class="fk" transform="translate(0,13)"/><text x="202.0" y="62.0" class="fi" font-size="12" text-anchor="start">Lee–Yang points, k = 1 + 2cos(2π/n)</text><path d="M450 53 l-5 10 h10 z" class="fi"/><text x="462.0" y="62.0" class="fi" font-size="12" text-anchor="start">at most m copies, k = −1/m</text><line x1="30.0" y1="196.0" x2="612.0" y2="196.0" class="sp" stroke-width="7"/><text x="73.8" y="240.0" class="fm" font-size="12" text-anchor="middle">−1</text><text x="136.4" y="240.0" class="fm" font-size="12" text-anchor="middle">−1/2</text><text x="199.0" y="240.0" class="fm" font-size="12" text-anchor="middle">0</text><text x="324.1" y="240.0" class="fm" font-size="12" text-anchor="middle">1</text><text x="449.3" y="240.0" class="fm" font-size="12" text-anchor="middle">2</text><text x="574.5" y="240.0" class="fm" font-size="12" text-anchor="middle">3</text><path d="M73.8 210 l-4 9 h8 z" class="fi"/><path d="M136.4 210 l-4 9 h8 z" class="fi"/><path d="M157.2 210 l-4 9 h8 z" class="fi"/><path d="M167.7 210 l-4 9 h8 z" class="fi"/><path d="M173.9 210 l-4 9 h8 z" class="fi"/><path d="M178.1 210 l-4 9 h8 z" class="fi"/><path d="M181.1 210 l-4 9 h8 z" class="fi"/><path d="M183.3 210 l-4 9 h8 z" class="fi"/><path d="M185.1 210 l-4 9 h8 z" class="fi"/><path d="M186.5 210