<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="The cross-section of a light beam grows as (1+a)(1+b) = 1 + a mult-add b; the ab corner is the focusing term" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arbundle" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><rect x="60" y="120" width="150" height="150" fill="currentColor" fill-opacity=".10" stroke-width="2"/><rect x="210" y="120" width="82.5" height="150" fill="currentColor" fill-opacity=".05"/><rect x="60" y="60.0" width="150" height="60.0" fill="currentColor" fill-opacity=".05"/><rect x="210" y="60.0" width="82.5" height="60.0" fill="#8fd3ff" fill-opacity=".55" stroke="#8fd3ff" stroke-width="2"/><text x="135.0" y="200.0" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" stroke="none">1</text><text x="251.25" y="200.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">a</text><text x="135.0" y="95.0" text-anchor="middle" font-size="16" font-weight="400" fill="currentColor" stroke="none">b</text><text x="251.25" y="95.0" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" stroke="none">ab</text><text x="176.25" y="294" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">stretch 1 + a across</text><text x="46" y="165.0" transform="rotate(-90 46 165.0)" text-anchor="middle" fill="currentColor" stroke="none">stretch 1 + b</text><text x="345" y="70" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">A thin beam of light:</text><text x="345" y="92" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">area = (1 + a)(1 + b)</text><text x="345" y="114" text-anchor="start" font-size="14" font-weight="700" fill="currentColor" stroke="none">       = 1 + (a ✳ b)</text><text x="345" y="136" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none"></text><text x="345" y="158" text-anchor="start" font-size="14" font-weight="400" fill="#8fd3ff" stroke="none">The ab corner is what makes</text><text x="345" y="180" text-anchor="start" font-size="14" font-weight="400" fill="#8fd3ff" stroke="none">light beams focus</text><text x="345" y="202" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">(Raychaudhuri's θ²/2 + σ² term).</text><text x="345" y="224" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none"></text><text x="345" y="246" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">Curvature bends a and b;</text><text x="345" y="268" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">matter's energy does the rest.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>