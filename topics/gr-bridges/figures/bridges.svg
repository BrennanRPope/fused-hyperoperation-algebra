<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 412" role="img" aria-label="What each of the four bridges needs, and which parts mult-add supplies" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arbridges" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><text x="20" y="90" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">Jacobson</text><rect x="140" y="68" width="122.6" height="34" rx="17" fill="#8fd3ff" fill-opacity=".25" stroke="#8fd3ff" stroke-width="1.5"/><text x="201.3" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">area bookkeeping</text><rect x="274.6" y="68" width="129.7" height="34" rx="17" fill="#8fd3ff" fill-opacity=".25" stroke="#8fd3ff" stroke-width="1.5"/><text x="339.45000000000005" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">Unruh temperature</text><rect x="416.3" y="68" width="136.8" height="34" rx="17" stroke="#ff5c8a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="484.70000000000005" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">entropy = η · area</text><rect x="565.1" y="68" width="151.0" height="34" rx="17" stroke="#ff5c8a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="640.6" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="#ff5c8a" stroke="none">matter's energy flow</text><line x1="876" y1="85" x2="905" y2="85" stroke-width="2" marker-end="url(#arbridges)"/><text x="970" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">Einstein + Λ</text><text x="20" y="168" text-anchor="start" font-size="16" font-we