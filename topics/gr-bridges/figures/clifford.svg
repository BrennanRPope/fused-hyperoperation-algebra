<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="The Clifford product of two vectors keeps the dot (the direction dial) and the wedge (the twist); mult-add with a Clifford weight is a + b + a k b" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arclifford" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><path d="M120 230 L300 210 L370 70 L190 90Z" fill="#8fd3ff" fill-opacity=".22" stroke="none"/><line x1="120" y1="230" x2="300" y2="210" stroke-width="2.5" marker-end="url(#arclifford)"/><line x1="120" y1="230" x2="190" y2="90" stroke-width="2.5" marker-end="url(#arclifford)"/><text x="314" y="216" text-anchor="start" font-size="16" font-weight="400" fill="currentColor" stroke="none">a</text><text x="176" y="90" text-anchor="end" font-size="16" font-weight="400" fill="currentColor" stroke="none">b</text><text x="255" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#8fd3ff" stroke="none">a ∧ b</text><text x="230" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#8fd3ff" stroke="none">the plane they span = a twist</text><text x="450" y="60" text-anchor="start" font-size="18" font-weight="700" fill="currentColor" stroke="none">ab  =  a·b  +  a ∧ b</text><text x="450" y="88" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">a·b = k_ij aⁱ bʲ : the direction dial (a metric)</text><text x="450" y="116" text-anchor="start" font-size="14" font-weight="400" fill="#8fd3ff" stroke="none">a ∧ b : the twist in the a-b plane</text><text x="450" y="144" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none"></text><text x="450" y="172" text-anchor="start" font-size="16" font-weight="700" fill="currentColor" stroke="none">mult-add with a Clifford weight k:  a + b + a k b</text><text x="450" y="200" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">1 + k(a ✳ b) = (1 + k a)(1 + k b), associative for every k</text><text x="450" y="228" text-anchor="start" font-size="14" font-weight="400" fill="#ff5c8a" stroke="none">k(x) alone: flat (pure gauge). Add a twist field:</text><text x="450" y="256" text-anchor="start" font-size="14" font-weight="400" fill="currentColor" stroke="none">gauge-theory gravity = general relativity</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>