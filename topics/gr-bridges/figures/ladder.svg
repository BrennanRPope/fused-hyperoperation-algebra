<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="Four steps: mult-add gives one fixed curvature; a place dial works in 2D but is blocked in 3D and 4D; a direction dial (a metric) gives any curvature" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arladder" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><rect x="20" y="10" width="220" height="300" rx="14" stroke-opacity=".35"/><text x="130" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">1. One direction</text><rect x="280" y="10" width="220" height="300" rx="14" stroke-opacity=".35"/><text x="390" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">2. Two directions</text><rect x="540" y="10" width="220" height="300" rx="14" stroke-opacity=".35"/><text x="650" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">3. Dial by place</text><rect x="800" y="10" width="220" height="300" rx="14" stroke-opacity=".35"/><text x="910" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">4. Dial by direction</text><line x1="40" y1="140" x2="220" y2="140" stroke-width="2"/><line x1="40" y1="118" x2="40" y2="162" stroke="#ff5c8a" stroke-width="3"/><line x1="220" y1="118" x2="220" y2="162" stroke="#ff5c8a" stroke-width="3"/><text x="40" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">−c</text><text x="220" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">+c</text><path d="M130 140 Q150 100 170 140" marker-end="url(#arladder)"/><path d="M170 140 Q183 110 196 140" marker-end="url(#arladder)"/><circle cx="130" cy="140" r="4" fill="currentColor"/><text x="130" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">speeds combine by mult-add</text><text x="130" y="235" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">the wall −1 is light speed</text><text x="130" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">no curvature yet</text><path d="M320 180 Q390 160 460 180 Q415 130 390 70 Q370 130 320 180Z" fill="#8fd3ff" fill-opacity=".18" stroke="#8fd3ff" stroke-width="2"/><path d="M430 70 A22 22 0 1 1 408 92" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arladder)"/><text x="466" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#8fd3ff" stroke="none">twist</text><text x="390" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">a loop of boosts twists</text><text x="390" y="235" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">twist = q × area</text><text x="390" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">one fixed curvature</text><polyline points="560.0,92.0 563.6,91.50863293628306 567.2,90.70353120368263 570.8,89.5514252443584 574.4,88.08264345822866 578.0,86.41420909681877 581.6,84.75756765479746 585.2,83.40219629958523 588.8,82.67162116271282 592.4,82.85678502796048 596.0,84.14081776150566 599.6,86.53559581787515 603.2,89.85087372337115 606.8,93.70988165800104 610.4,97.61253164303392 614.0,101.03277415925257 617.6,103.5253970804378 621.2,104.81394665397436 624.8,104.83700070928 628.4,103.74278824428765 632.0,101.83749502245477 635.6,99.50513784211917 639.2,97.12266040769991 642.8,94.99176676783301 646.4,93.30078178511614 650.0,92.11918599236864 653.6,91.41826972165063 657.2,91.10617099361257 660.8,91.06504419909844 664.4,91.18117907126394 668.0,91.36358884835326 671.6,91.55099819560363 675.2,91.71006834597208 678.8,91.8287714980255 682.4,91.90843620473555 686.0,91.95681668663326 689.6,91.9832467717037 693.2,91.99594421409293 696.8,92.00098115840142 700.4,92.00227813399692 704.0,92.00206658557101 707.6,92.00145070382975" stroke="#8fd3ff" stroke-width="2"/><text x="560" y="128" text-anchor="start" font-size="12" font-weight="400" fill="#8fd3ff" stroke="none">2D: any q(x, y) works</text><path d="M680 205 h40 v-40 h-40z M680 165 l16 -12 h40 l-16 12 M720 205 l16 -12 v-40" stroke-width="1.5"/><path d="M680 205 h40 v-40 h-40z" fill="#ff5c8a" fill-opacity=".22" stroke="none"/><path d="M680 165 l16 -12 h40 l-16 12z" fill="#8fd3ff" fill-opacity=".22" stroke="none"/><text x="560" y="180" text-anchor="start" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">3D, 4D: each plane</text><text x="560" y="196" text-anchor="start" font-size="12" font-weight="400" fill="#ff5c8a" stroke="none">wants its own q</text><text x="650" y="245" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">Schur: a same-every-way</text><text x="650" y="263" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">dial cannot vary</text><text x="650" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#ff5c8a" stroke="none">blocked in 3D and 4D</text><ellipse cx="850" cy="90" rx="22" ry="10" transform="rotate(10 850 90)" stroke="#8fd3ff" stroke-width="2"/><ellipse cx="910" cy="80" rx="16" ry="14" transform="rotate(50 910 80)" stroke="#8fd3ff" stroke-width="2"/><ellipse cx="970" cy="95" rx="24" ry="8" transform="rotate(-30 970 95)" stroke="#8fd3ff" stroke-width="2"/><ellipse cx="860" cy="160" rx="12" ry="20" transform="rotate(0 860 160)" stroke="#8fd3ff" stroke-width="2"/><ellipse cx="920" cy="150" rx="26" ry="12" transform="rotate(70 920 150)" stroke="#8fd3ff" stroke-width="2"/><ellipse cx="980" cy="165" rx="14" ry="14" transform="rotate(0 980 165)" stroke="#8fd3ff" stroke-width="2"/><text x="910" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">a dial for each direction</text><text x="910" y="235" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">pair: k_ij = the metric</text><text x="910" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">any curvature</text><line x1="244" y1="160" x2="276" y2="160" stroke-width="2" marker-end="url(#arladder)"/><line x1="504" y1="160" x2="536" y2="160" stroke-width="2" marker-end="url(#arladder)"/><line x1="764" y1="160" x2="796" y2="160" stroke-width="2" marker-end="url(#arladder)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>