<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" role="img" aria-label="The river picture: torsion is the river's speed-up, Newton's pull is speed times torsion, and the curvature twist is its slope" font-family="Hanken Grotesk, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="13" fill="none" stroke="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arriver" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><circle cx="70" cy="120" r="40" fill="currentColor" fill-opacity=".85" stroke="none"/><text x="70" y="185" text-anchor="middle" font-size="13" font-weight="400" fill="currentColor" stroke="none">mass</text><line x1="222.25" y1="120" x2="164.11816410238202" y2="120" stroke="#8fd3ff" stroke-width="2.8793103448275863" marker-end="url(#arriver)"/><line x1="280.0" y1="120" x2="230.50252531694167" y2="120" stroke="#8fd3ff" stroke-width="2.5" marker-end="url(#arriver)"/><line x1="353.5" y1="120" x2="310.89935663848706" y2="120" stroke="#8fd3ff" stroke-width="2.2407407407407405" marker-end="url(#arriver)"/><line x1="448.0" y1="120" x2="411.1067606313689" y2="120" stroke="#8fd3ff" stroke-width="2.0555555555555554" marker-end="url(#arriver)"/><line x1="574.0" y1="120" x2="542.0495174788653" y2="120" stroke="#8fd3ff" stroke-width="1.9166666666666667" marker-end="url(#arriver)"/><line x1="742.0" y1="120" x2="714.3300704735267" y2="120" stroke="#8fd3ff" stroke-width="1.8125" marker-end="url(#arriver)"/><line x1="962.5" y1="120" x2="938.4901980800488" y2="120" stroke="#8fd3ff" stroke-width="1.7352941176470589" marker-end="url(#arriver)"/><text x="560" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none">the river: space flows inward at escape speed, v² = 2M/r</text><text x="300" y="205" text-anchor="middle" font-size="1" font-weight="400" fill="currentColor" stroke="none"></text><text x="300" y="205" text-anchor="middle" font-size="1" font-weight="400" fill="currentColor" stroke="none"></text><text x="300" y="205" text-anchor="middle" font-size="1" font-weight="400" fill="currentColor" stroke="none"></text><text x="300" y="205" text-anchor="middle" font-size="1" font-weight="400" fill="currentColor" stroke="none"></text><text x="140" y="222" text-anchor="start" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">speed</text><text x="140" y="244" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">v</text><text x="365" y="222" text-anchor="start" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">torsion</text><text x="365" y="244" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">v′ (how fast the flow speeds up)</text><text x="590" y="222" text-anchor="start" font-size="13" font-weight="700" fill="#8fd3ff" stroke="none">Newton's pull</text><text x="590" y="244" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">v v′ = −M/r²</text><text x="815" y="222" text-anchor="start" font-size="13" font-weight="700" fill="currentColor" stroke="none">twist (curvature)</text><text x="815" y="244" text-anchor="start" font-size="13" font-weight="400" fill="currentColor" stroke="none">(v v′)′ = 2M/r³</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>