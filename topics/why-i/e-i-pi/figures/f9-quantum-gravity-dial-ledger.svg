<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="515" viewBox="0 0 1180 515" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="515" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">Which dials a quantum-gravity picture needs, read through e, i and π</text>
<rect x="40.0" y="80.0" width="520.0" height="150.0" rx="12" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.1"/>
<rect x="40.0" y="80.0" width="520.0" height="150.0" rx="12" stroke="#2a6fdb" fill="none" stroke-width="2" opacity="1"/>
<text x="60.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#2a6fdb" font-weight="bold">c  →  signature dial</text>
<text x="60.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Cayley–Klein κ₂ = −1/c². Wick rotation flips</text>
<text x="60.0" y="168.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">this dial from real (boosts) to imaginary</text>
<text x="60.0" y="186.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">(turns): k → ik. Already in the framework.</text>
<rect x="620.0" y="80.0" width="520.0" height="150.0" rx="12" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.1"/>
<rect x="620.0" y="80.0" width="520.0" height="150.0" rx="12" stroke="#e07b1a" fill="none" stroke-width="2" opacity="1"/>
<text x="640.0" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#e07b1a" font-weight="bold">ħ  →  order dial</text>
<text x="640.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Sets the size of the imaginary dial (k = −i/ħ)</text>
<text x="640.0" y="168.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">and the imaginary-time period βħ.</text>
<text x="640.0" y="186.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Direction forced (keep size); size not.</text>
<rect x="40.0" y="270.0" width="520.0" height="150.0" rx="12" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.1"/>
<rect x="40.0" y="270.0" width="520.0" height="150.0" rx="12" stroke="#2e9e5b" fill="none" stroke-width="2" opacity="1"/>
<text x="60.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#2e9e5b" font-weight="bold">Λ  →  curvature dial</text>
<text x="60.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Cayley–Klein κ₁: de Sitter / anti-de Sitter.</text>
<text x="60.0" y="358.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">In de Sitter the horizon also has a 2π period</text>
<text x="60.0" y="376.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">(Gibbons–Hawking temperature). In the framework.</text>
<rect x="620.0" y="270.0" width="520.0" height="150.0" rx="12" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.1"/>
<rect x="620.0" y="270.0" width="520.0" height="150.0" rx="12" stroke="#d0443a" fill="none" stroke-width="2" opacity="1"/>
<text x="640.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#d0443a" font-weight="bold">G  →  no dial</text>
<text x="640.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Enters Hawking's T only through the horizon:</text>
<text x="640.0" y="358.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">κ = c⁴/(4GM). No composition law forces it</text>
<text x="640.0" y="376.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">(dial-map page). This is the open piece.</text>
<text x="40.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">e, i, π tell us the needed kinds of dial: one that can be turned imaginary (c, via Wick), one that sets its size (ħ), and a compact period 2π that any horizon must honour.</text>
<text x="40.0" y="492.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">They do not supply G. The common proof (Euler) links the dials' directions, not their sizes.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
