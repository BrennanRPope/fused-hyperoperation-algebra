<text x="30.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Optics, Fourier</text>
<text x="230.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">a shift becomes a phase; size-keeping modes</text>
