<text x="890.0" y="588.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7b4fc9" font-weight="normal">keep-size + local tomography</text>
<text x="30.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Green: a real formulation exists and says the same.  Amber: i can be renamed but not removed (it becomes a geometric object or a proof tool).  Red: experiment rules out the real version.</text>
