<text x="230.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">phase-space turn; symplectic area + length</text>
<rect x="620.0" y="414.0" width="250.0" height="28.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
