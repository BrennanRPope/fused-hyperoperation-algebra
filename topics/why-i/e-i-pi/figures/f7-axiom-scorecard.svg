<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="620" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">The published axioms that derive complex quantum theory, checked against the framework</text>
<text x="40.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">Hardy 2001</text>
<rect x="60.0" y="80.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">1 Probabilities as frequencies</text>
<rect x="60.0" y="104.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">2 Simplicity (K depends on N, least K)</text>
<rect x="60.0" y="128.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="143.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="143.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">3 Subspaces behave like smaller systems</text>
<rect x="60.0" y="152.0" width="220.0" height="20.0" rx="5" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">expresses it exactly</text>
<text x="300.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">4 Composite systems: N_AB = N_A N_B, K_AB = K_A K_B</text>
<rect x="60.0" y="176.0" width="220.0" height="20.0" rx="5" stroke="#d9a400" fill="#d9a400" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">supplies the turning it needs</text>
<text x="300.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">5 Continuity: continuous reversible maps between pure states</text>
<text x="40.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">Masanes–Müller 2011</text>
<rect x="60.0" y="234.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">1 Finiteness</text>
<rect x="60.0" y="258.0" width="220.0" height="20.0" rx="5" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="273.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">expresses it exactly</text>
<text x="300.0" y="273.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">2 Local tomography</text>
<rect x="60.0" y="282.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">3 Equivalence of subspaces</text>
<rect x="60.0" y="306.0" width="220.0" height="20.0" rx="5" stroke="#d9a400" fill="#d9a400" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">supplies the turning it needs</text>
<text x="300.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">4 Symmetry (reversible maps reach every pure state)</text>
<rect x="60.0" y="330.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">5 All measurements allowed</text>
<text x="40.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">Chiribella–D'Ariano–Perinotti 2011</text>
<rect x="60.0" y="388.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="403.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="403.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Causality</text>
<rect x="60.0" y="412.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Perfect distinguishability</text>
<rect x="60.0" y="436.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Ideal compression</text>
<rect x="60.0" y="460.0" width="220.0" height="20.0" rx="5" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="475.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">expresses it exactly</text>
<text x="300.0" y="475.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Local distinguishability (= local tomography)</text>
<rect x="60.0" y="484.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Pure conditioning</text>
<rect x="60.0" y="508.0" width="220.0" height="20.0" rx="5" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.2" opacity="0.2"/>
<text x="70.0" y="523.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">not addressed</text>
<text x="300.0" y="523.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Purification</text>
<text x="40.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">No axiom is violated: the framework says nothing about states, measurements or probabilities, so most axioms are simply outside it.</text>
<text x="40.0" y="582.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">Green: K_AB − 1 = (K_A − 1) ∘ (K_B − 1) (check B1). Amber: continuous reversible maps need a turning (imaginary) dial (checks A4, B7).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
