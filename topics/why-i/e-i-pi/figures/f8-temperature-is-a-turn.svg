<line x1="200.0" y1="260.0" x2="275.0" y2="389.9" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="200.0" y2="410.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="125.0" y2="389.9" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="70.1" y2="335.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="50.0" y2="260.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="70.1" y2="185.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="125.0" y2="130.1" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="200.0" y2="110.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="275.0" y2="130.1" stroke="#9bc" stroke-width="1" opacity="1"/>
<line x1="200.0" y1="260.0" x2="329.9" y2="185.0" stroke="#9bc" stroke-width="1" opacity="1"/>
<circle cx="200.0" cy="260.0" r="50.0" stroke="#9bc" fill="none" stroke-width="1" opacity="1"/>
<circle cx="200.0" cy="260.0" r="100.0" stroke="#9bc" fill="none" stroke-width="1" opacity="1"/>
<text x="200.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2e9e5b" font-weight="bold">period 2π: smooth (no tip)</text>
<text x="200.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Euclidean horizon: time made imaginary</text>
<text x="200.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">becomes an angle round the horizon</text>
<path d="M410.0,390.0 L520.0,180.0 L630.0,390.0 Z" stroke="#d0443a" stroke-width="2" fill="#d0443a" opacity="0.12" stroke-linejoin="round"/>
<ellipse cx="520.0" cy="390.0" rx="110.0" ry="24.0" stroke="#d0443a" fill="none" stroke-width="2" opacity="1"/>
<line x1="410.0" y1="390.0" x2="520.0" y2="180.0" stroke="#d0443a" stroke-width="2" opacity="1"/>
<line x1="630.0" y1="390.0" x2="520.0" y2="180.0" stroke="#d0443a" stroke-width="2" opacity="1"/>
<text x="532.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">tip</text>
<text x="208.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">horizon</text>
<line x1="358.0" y1="260.0" x2="358.0" y2="220.0" stroke="#2e9e5b" stroke-width="2" marker-end="url(#ah2e9e5b)" opacity="1"/>
<text x="364.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2e9e5b" font-weight="normal">imaginary time τ</text>
<text x="520.0" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d0443a" font-weight="bold">any other period: a cone tip</text>
<text x="520.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d0443a" font-weight="normal">(the horizon would be singular)</text>
<text x="720.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="26" text-anchor="start" fill="#222222" font-weight="bold">T  =  ħ c³ / (8π G M k_B)</text>
<text x="720.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">• i : time t → −iτ (Wick); a thermal state is a</text>
<text x="720.0" y="188.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">   period in imaginary time (KMS, check C19)</text>
<text x="720.0" y="206.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="720.0" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">• π : the 2π is one full turn, forced by</text>
<text x="720.0" y="242.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">   smoothness at the horizon (check C21)</text>
<text x="720.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="720.0" y="279.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">• e : the thermal weight e^(−E/k_B T) is</text>
<text x="720.0" y="297.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">   evolution e^(−iHt/ħ) at imaginary time</text>
<text x="720.0" y="315.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="720.0" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">• ħ, c, G, k_B all appear; G only through the</text>
<text x="720.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">   horizon's surface gravity κ = c⁴/(4GM)</text>
<text x="720.0" y="370.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="720.0" y="388.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Known: Hawking 1975, Gibbons–Hawking 1977,</text>
<text x="720.0" y="406.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Unruh 1976, Bisognano–Wichmann 1975.</text>
