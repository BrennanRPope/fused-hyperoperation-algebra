<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="540" fill="white"/>
<defs><marker id="ah2e9e5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker></defs>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">Hawking's temperature: the one formula where e, i, π and ħ, c, G all meet</text>
<circle cx="200.0" cy="260.0" r="150.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="2" opacity="0.12"/>
<line x1="200.0" y1="260.0" x2="350.0" y2="260.0" stroke="#9bc" stroke-width="1" opacity="1"/>
