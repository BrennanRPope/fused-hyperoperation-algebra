<rect x="260.0" y="420.0" width="18.0" height="18.0" rx="0" stroke="white" fill="#2a6fdb" stroke-width="1.2" opacity="1"/>
<text x="286.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">A's own parameters (a)</text>
<rect x="480.0" y="420.0" width="18.0" height="18.0" rx="0" stroke="white" fill="#e07b1a" stroke-width="1.2" opacity="1"/>
<text x="506.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">B's own parameters (b)</text>
<rect x="700.0" y="420.0" width="18.0" height="18.0" rx="0" stroke="white" fill="#7b4fc9" stroke-width="1.2" opacity="1"/>
<text x="726.0" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">correlations (a·b)</text>
<text x="50.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Hardy (2001), Wootters (1990): K_AB = K_A·K_B. Read as (1 + a)(1 + b) = 1 + (a + b + ab), it is the weighted circle operation at k = 1 on parameter counts.</text>
<text x="50.0" y="492.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">The grid is the known Fano/Bloch split of a two-qubit state (15 = 3 + 3 + 9). Only the reading as mult-add is ours.</text>
