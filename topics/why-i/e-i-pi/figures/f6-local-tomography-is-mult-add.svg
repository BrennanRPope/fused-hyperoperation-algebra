<text x="800.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">Quaternionic</text>
<text x="800.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">5 + 5 + 5·5 = 35 needed, only 27 exist</text>
<text x="800.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#d0443a" font-weight="normal">red outlines: 8 needed cells that don't exist,</text>
<text x="800.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#d0443a" font-weight="normal">so there is no standard way to combine</text>
