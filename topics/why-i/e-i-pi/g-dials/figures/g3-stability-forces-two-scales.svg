<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="600" fill="white"/>
<defs><marker id="ah999" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">The same stability test that forces c and ħ forces two more scales: a length ℓ and a curvature radius L</text>
<line x1="230.0" y1="432.0" x2="230.0" y2="198.0" stroke="#999" stroke-width="2.5" marker-end="url(#ah999)" opacity="1"/>
<line x1="640.0" y1="432.0" x2="640.0" y2="198.0" stroke="#999" stroke-width="2.5" marker-end="url(#ah999)" opacity="1"/>
<line x1="380.0" y1="470.0" x2="490.0" y2="470.0" stroke="#999" stroke-width="2.5" marker-end="url(#ah999)" opacity="1"/>
<line x1="380.0" y1="160.0" x2="490.0" y2="160.0" stroke="#999" stroke-width="2.5" marker-end="url(#ah999)" opacity="1"/>
<rect x="80.0" y="432.0" width="300.0" height="76.0" rx="10" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.15"/>
<text x="230.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#d0443a" font-weight="bold">Poincaré + Heisenberg</text>
<text x="230.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">can still deform: dim H² = 7 (3+1: 3)</text>
<rect x="80.0" y="122.0" width="300.0" height="76.0" rx="10" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.15"/>
<text x="230.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e07b1a" font-weight="bold">+ minimal length ℓ</text>
<text x="230.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">positions stop commuting; dim H² = 1</text>
<rect x="490.0" y="432.0" width="300.0" height="76.0" rx="10" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.15"/>
<text x="640.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e07b1a" font-weight="bold">+ curvature radius L</text>
<text x="640.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">curved momenta / de Sitter; dim H² = 1</text>
<rect x="490.0" y="122.0" width="300.0" height="76.0" rx="10" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.15"/>
<text x="640.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2e9e5b" font-weight="bold">both: rigid</text>
<text x="640.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">dim H² = 0 (1+1 and 3+1)</text>
<text x="215.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal" transform="rotate(-90 215.0 330.0)">turn on ℓ</text>
<text x="435.0" y="455.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal">turn on 1/L</text>
<text x="830.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">With ħ fixed by [x, p] = iħ, the rigid algebra</text>
<text x="830.0" y="168.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">carries ONE pure number: ℓ² / L².</text>
<text x="830.0" y="186.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="830.0" y="204.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">If ℓ is the Planck length and L the de Sitter</text>
<text x="830.0" y="222.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">radius, ℓ²/L² = G ħ Λ / (3c³) ≈ 10⁻¹²²,</text>
<text x="830.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">the same number MacDowell–Mansouri and</text>
<text x="830.0" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Freidel–Starodubtsev expand gravity in.</text>
<text x="830.0" y="277.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="830.0" y="295.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Then G = c³ ℓ² / ħ: G is ℓ's square in</text>
<text x="830.0" y="313.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">other units, not a dial of its own.</text>
<text x="830.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2e9e5b" font-weight="normal">Known: the algebra and its rigidity</text>
<text x="830.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2e9e5b" font-weight="normal">(Mendes 1994; Chryssomalakos–Okon 2004).</text>
<text x="830.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#e07b1a" font-weight="normal">Ours: the meeting with G ħ Λ/c³.</text>
<text x="830.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">Open: is ℓ really the Planck length?</text>
<text x="60.0" y="575.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">dim H²(g, g) computed in checks S2 and S4 (Chevalley–Eilenberg, numpy). H² = 0 means no small change of the brackets is possible: the algebra is stable.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
