<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="520" fill="white"/>
<defs><marker id="ah222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Three genuine dials containing G: each starts from a stable theory, the form of the change is forced, its size is free</text>
<rect x="40.0" y="90.0" width="330.0" height="70.0" rx="10" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.12"/>
<text x="205.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">free gravitons on flat space</text>
<line x1="380.0" y1="125.0" x2="760.0" y2="125.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah222222)" opacity="1"/>
<text x="570.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e07b1a" font-weight="bold">turn √G (self-coupling)</text>
<text x="570.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal">form forced, size free</text>
<rect x="770.0" y="90.0" width="370.0" height="70.0" rx="10" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.12"/>
<text x="955.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">general relativity (+Λ), unique</text>
<text x="40.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">Gupta 1954, Deser 1970; Boulanger–Damour–Gualtieri–Henneaux 2001</text>
<rect x="40.0" y="220.0" width="330.0" height="70.0" rx="10" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.12"/>
<text x="205.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">topological BF theory (no local gravitons)</text>
<line x1="380.0" y1="255.0" x2="760.0" y2="255.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah222222)" opacity="1"/>
<text x="570.0" y="245.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e07b1a" font-weight="bold">turn α = G ħ Λ / c³</text>
<text x="570.0" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal">form forced, size free</text>
<rect x="770.0" y="220.0" width="370.0" height="70.0" rx="10" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.12"/>
<text x="955.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">general relativity + Λ</text>
<text x="40.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">MacDowell–Mansouri 1977; Freidel–Starodubtsev 2005</text>
<rect x="40.0" y="350.0" width="330.0" height="70.0" rx="10" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.12"/>
<text x="205.0" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">Poincaré + Heisenberg (can still deform)</text>
<line x1="380.0" y1="385.0" x2="760.0" y2="385.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah222222)" opacity="1"/>
<text x="570.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e07b1a" font-weight="bold">turn ℓ and L</text>
<text x="570.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal">form forced, size free</text>
<rect x="770.0" y="350.0" width="370.0" height="70.0" rx="10" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.12"/>
<text x="955.0" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">the rigid two-scale algebra</text>
<text x="40.0" y="442.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">Mendes 1994; Chryssomalakos–Okon 2004</text>
<text x="40.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">This is the same standing as ħ: deformation quantization's form is unique up to equivalence (Moyal), its size is not. None of the three fixes the value of G.</text>
