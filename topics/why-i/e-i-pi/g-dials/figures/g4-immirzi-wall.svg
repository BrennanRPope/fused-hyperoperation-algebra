<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="560" fill="white"/>
<defs><marker id="ah8a8a8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs>
<defs><marker id="ah2a6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fdb"/></marker></defs>
<defs><marker id="ah7b4fc9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fc9"/></marker></defs>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">The Barbero–Immirzi parameter is a dial on the Hodge star, which plays i: its self-dual value sits on the wall</text>
<rect x="80.0" y="90.0" width="380.0" height="380.0" rx="0" stroke="#999" fill="none" stroke-width="1" opacity="1"/>
<line x1="80.0" y1="280.0" x2="460.0" y2="280.0" stroke="#aaa" stroke-width="1" opacity="1"/>
<line x1="270.0" y1="90.0" x2="270.0" y2="470.0" stroke="#aaa" stroke-width="1" opacity="1"/>
<text x="270.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Lorentzian (★² = −1)</text>
<path d="M80.0,280.0 L460.0,280.0" stroke="#2e9e5b" stroke-width="4" fill="none" opacity="1" stroke-linejoin="round"/>
<text x="349.2" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2e9e5b" font-weight="normal">real 1/γ: Barbero (always invertible)</text>
<circle cx="270.0" cy="280.0" r="6.0" stroke="#222222" fill="#222222" stroke-width="1.5" opacity="1"/>
<text x="276.3" y="303.8" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">1/γ = 0: Palatini</text>
<circle cx="270.0" cy="200.8" r="8.0" stroke="#d0443a" fill="#d0443a" stroke-width="1.5" opacity="1"/>
<text x="279.5" y="192.9" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#d0443a" font-weight="normal">1/γ = −i: self-dual (Ashtekar)</text>
<circle cx="270.0" cy="359.2" r="8.0" stroke="#d0443a" fill="#d0443a" stroke-width="1.5" opacity="1"/>
<text x="279.5" y="351.2" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#d0443a" font-weight="normal">1/γ = i: self-dual (Ashtekar)</text>
<line x1="396.7" y1="394.8" x2="452.1" y2="394.8" stroke="#7b4fc9" stroke-width="1.5" marker-end="url(#ah7b4fc9)" opacity="1"/>
<text x="293.8" y="418.5" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#7b4fc9" font-weight="normal">black-hole count γ = 0.2375 is at 1/γ = 4.2 →</text>
<text x="270.0" y="495.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">det(1 + ★/γ) = (1 + 1/γ²)³ is zero only at 1/γ = ±i</text>
<rect x="620.0" y="90.0" width="380.0" height="380.0" rx="0" stroke="#999" fill="none" stroke-width="1" opacity="1"/>
<line x1="620.0" y1="280.0" x2="1000.0" y2="280.0" stroke="#aaa" stroke-width="1" opacity="1"/>
<line x1="810.0" y1="90.0" x2="810.0" y2="470.0" stroke="#aaa" stroke-width="1" opacity="1"/>
<text x="810.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Euclidean (★² = +1)</text>
<path d="M620.0,280.0 L1000.0,280.0" stroke="#2e9e5b" stroke-width="4" fill="none" opacity="1" stroke-linejoin="round"/>
<text x="627.9" y="268.1" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2e9e5b" font-weight="normal">real 1/γ</text>
<circle cx="810.0" cy="280.0" r="6.0" stroke="#222222" fill="#222222" stroke-width="1.5" opacity="1"/>
<text x="750.6" y="382.9" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">1/γ = 0: Palatini</text>
<circle cx="889.2" cy="280.0" r="8.0" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.5" opacity="1"/>
<circle cx="730.8" cy="280.0" r="8.0" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.5" opacity="1"/>
<text x="857.5" y="204.8" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2a6fdb" font-weight="normal">wall 1/γ = ±1</text>
<text x="857.5" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2a6fdb" font-weight="normal">UV fixed point γ² = 1</text>
<text x="857.5" y="244.4" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2a6fdb" font-weight="normal">(Benedetti–Speziale 2011)</text>
<line x1="976.2" y1="327.5" x2="897.1" y2="287.9" stroke="#2a6fdb" stroke-width="1.5" marker-end="url(#ah2a6fdb)" opacity="1"/>
<line x1="825.8" y1="327.5" x2="881.2" y2="287.9" stroke="#2a6fdb" stroke-width="1.5" marker-end="url(#ah2a6fdb)" opacity="1"/>
<text x="825.8" y="351.2" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2a6fdb" font-weight="normal">renormalization flow</text>
<text x="810.0" y="495.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">det(1 + ★/γ) = (1 − 1/γ²)³ is zero only at 1/γ = ±1</text>
<text x="520.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal">Wick</text>
<line x1="480.0" y1="280.0" x2="560.0" y2="280.0" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah8a8a8a)" opacity="1"/>
<text x="60.0" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Known: γ = ±i (Lorentzian) / ±1 (Euclidean) give self-dual variables; checks I1–I4. Ours: reading those values as the wall of the lift 1 + ★/γ.</text>
