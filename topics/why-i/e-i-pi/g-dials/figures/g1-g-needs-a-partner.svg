<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="560" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">G has units, so it can't be a dial by itself: every pure number with G in it pairs G with something else</text>
<line x1="60.0" y1="120.0" x2="1120.0" y2="120.0" stroke="#222222" stroke-width="2" opacity="1"/>
<line x1="101.7" y1="114.0" x2="101.7" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="101.7" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-120</text>
<line x1="268.7" y1="114.0" x2="268.7" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="268.7" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-100</text>
<line x1="435.6" y1="114.0" x2="435.6" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="435.6" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-80</text>
<line x1="602.5" y1="114.0" x2="602.5" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="602.5" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-60</text>
<line x1="769.4" y1="114.0" x2="769.4" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="769.4" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-40</text>
<line x1="936.4" y1="114.0" x2="936.4" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="936.4" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">10^-20</text>
<line x1="1103.3" y1="114.0" x2="1103.3" y2="126.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="1103.3" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">1</text>
<circle cx="88.9" cy="120.0" r="6.0" stroke="#d0443a" fill="#d0443a" stroke-width="1.5" opacity="1"/>
<line x1="88.9" y1="128.0" x2="88.9" y2="204.0" stroke="#d0443a" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="98.9" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">G ħ Λ / c³  ≈ 10^-122: Planck length² × cosmological curvature (MacDowell–Mansouri, Freidel–Starodubtsev)</text>
<circle cx="784.2" cy="120.0" r="6.0" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.5" opacity="1"/>
<line x1="784.2" y1="128.0" x2="784.2" y2="248.0" stroke="#7b4fc9" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="774.2" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7b4fc9" font-weight="normal">G m_p² / (ħ c)  ≈ 10^-38: gravity's 'fine-structure constant' for a proton</text>
<circle cx="978.3" cy="120.0" r="6.0" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.5" opacity="1"/>
<line x1="978.3" y1="128.0" x2="978.3" y2="292.0" stroke="#2a6fdb" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="968.3" y="302.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#2a6fdb" font-weight="normal">E / E_P  ≈ 10^-15: LHC collision energy over the Planck energy (κ-Poincaré dial)</text>
<circle cx="1026.9" cy="120.0" r="6.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.5" opacity="1"/>
<line x1="1026.9" y1="128.0" x2="1026.9" y2="336.0" stroke="#2e9e5b" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="1016.9" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#2e9e5b" font-weight="normal">G M / (R c²)  ≈ 10^-9: Earth's compactness</text>
<circle cx="1056.0" cy="120.0" r="6.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.5" opacity="1"/>
<line x1="1056.0" y1="128.0" x2="1056.0" y2="380.0" stroke="#2e9e5b" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="1046.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#2e9e5b" font-weight="normal">G M / (R c²)  ≈ 10^-6: the Sun's compactness</text>
<circle cx="1097.5" cy="120.0" r="6.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.5" opacity="1"/>
<line x1="1097.5" y1="128.0" x2="1097.5" y2="424.0" stroke="#2e9e5b" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="1087.5" y="434.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#2e9e5b" font-weight="normal">G M / (R c²)  ≈ 10^-1: a neutron star</text>
<circle cx="1100.8" cy="120.0" r="6.0" stroke="#222222" fill="#222222" stroke-width="1.5" opacity="1"/>
<line x1="1100.8" y1="128.0" x2="1100.8" y2="468.0" stroke="#222222" stroke-width="1" stroke-dasharray="3,3" opacity="1"/>
<text x="1090.8" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">G M / (R c²) = ½: a black hole: the horizon (the wall)</text>
<text x="60.0" y="535.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">Dimension count (check D1): with ħ, c and Λ there is exactly one pure number containing G, namely GħΛ/c³ ≈ 2.9×10⁻¹²².</text>
