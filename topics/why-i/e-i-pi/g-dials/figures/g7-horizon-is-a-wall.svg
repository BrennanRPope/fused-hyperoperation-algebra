<text x="210.0" y="113.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2a6fdb" font-weight="normal">outside: time is time</text>
<text x="502.0" y="385.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">inside: time and</text>
<text x="502.0" y="407.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">radius trade roles</text>
<text x="102.0" y="276.8" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">slope at the wall → surface gravity c⁴/4GM</text>
<text x="102.0" y="296.4" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">→ with the 2π period, Hawking's T</text>
<text x="730.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Reading (ours): G/c² is the dial that turns mass</text>
<text x="730.0" y="136.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">into length, and the horizon is where the lift</text>
<text x="730.0" y="153.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">1 + kx reaches its wall −1/k.</text>
<text x="730.0" y="170.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="730.0" y="187.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Past the wall the lift goes negative, the same</text>
<text x="730.0" y="204.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">flip as mult-add past its wall (why-i, part 2).</text>
<text x="730.0" y="221.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="730.0" y="238.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Limit: masses do not compose by mult-add</text>
<text x="730.0" y="255.2" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">(dial-map G1–G2), and redshift factors that do</text>
<text x="730.0" y="272.1" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">compose that way have dial 1/c², not G.</text>
<text x="730.0" y="289.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">So this places G; it does not dial it.</text>
<text x="90.0" y="495.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Checks W1–W3.</text>
