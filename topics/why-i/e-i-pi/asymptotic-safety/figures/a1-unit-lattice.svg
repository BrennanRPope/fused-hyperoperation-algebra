<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="600" fill="white"/>
<defs><marker id="ah7b4fc9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fc9"/></marker></defs>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Units form a lattice; setting ħ = c = 1 collapses it to one line, and G sits two steps below a pure number</text>
<line x1="80.0" y1="140.0" x2="1100.0" y2="140.0" stroke="#222222" stroke-width="2" opacity="1"/>
<line x1="152.9" y1="134.0" x2="152.9" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="152.9" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">-3</text>
<line x1="298.6" y1="134.0" x2="298.6" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="298.6" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">-2</text>
<line x1="444.3" y1="134.0" x2="444.3" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="444.3" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">-1</text>
<line x1="590.0" y1="134.0" x2="590.0" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="590.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">0</text>
<line x1="735.7" y1="134.0" x2="735.7" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="735.7" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">+1</text>
<line x1="881.4" y1="134.0" x2="881.4" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="881.4" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">+2</text>
<line x1="1027.1" y1="134.0" x2="1027.1" y2="146.0" stroke="#222222" stroke-width="1.5" opacity="1"/>
<text x="1027.1" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">+3</text>
<text x="80.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">mass dimension (ħ = c = 1)</text>
<circle cx="298.6" cy="140.0" r="7.0" stroke="#d0443a" fill="#d0443a" stroke-width="1.5" opacity="1"/>
<text x="298.6" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d0443a" font-weight="bold">G</text>
<circle cx="881.4" cy="140.0" r="7.0" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.5" opacity="1"/>
<text x="881.4" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2a6fdb" font-weight="bold">Λ</text>
<circle cx="735.7" cy="140.0" r="7.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.5" opacity="1"/>
<text x="735.7" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2e9e5b" font-weight="bold">probe scale k</text>
<circle cx="590.0" cy="140.0" r="7.0" stroke="#8a8a8a" fill="#8a8a8a" stroke-width="1.5" opacity="1"/>
<text x="590.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="bold">ħ, c</text>
<circle cx="590.0" cy="140.0" r="7.0" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.5" opacity="1"/>
<text x="590.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7b4fc9" font-weight="bold">g = G k²</text>
<circle cx="590.0" cy="140.0" r="7.0" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.5" opacity="1"/>
<text x="590.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e07b1a" font-weight="bold">G Λ</text>
<line x1="298.6" y1="232.0" x2="578.3" y2="232.0" stroke="#7b4fc9" stroke-width="1.5" marker-end="url(#ah7b4fc9)" opacity="1"/>
<text x="444.3" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7b4fc9" font-weight="normal">multiply by k² (two steps up)</text>
<text x="80.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Do three constants reach every unit with whole powers? The lattice index says (check U1–U2):</text>
<rect x="80.0" y="380.0" width="1020.0" height="40.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.08"/>
<text x="100.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">c, ħ, m (a mass)</text>
<text x="330.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#2e9e5b" font-weight="bold">index 1</text>
<text x="450.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">every unit is a whole-power product: no roots (Compton units)</text>
<rect x="80.0" y="428.0" width="1020.0" height="40.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.08"/>
<text x="100.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">c, ħ, G</text>
<text x="330.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#d0443a" font-weight="bold">index 2</text>
<text x="450.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">a length needs a square root: ℓ_P = √(ħG/c³)</text>
<rect x="80.0" y="476.0" width="1020.0" height="40.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.08"/>
<text x="100.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">c, ħ, Λ</text>
<text x="330.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#d0443a" font-weight="bold">index 2</text>
<text x="450.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">again a square root: L = √(3/Λ)</text>
<text x="80.0" y="545.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal">Reading (ours): gravity's scales sit at 'odd' places in the unit lattice, which is why G = c³ℓ²/ħ comes as a square (g-dials S7).</text>
<text x="80.0" y="568.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Known: units as a free abelian group (Buckingham π, the Lean formalisation of dimensional analysis); the √ in Planck units.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
