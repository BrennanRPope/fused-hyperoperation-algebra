<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">In the variable 1/g, running G is our weighted circle operation: equal RG steps, a wall at the fixed point</text>
<text x="80.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#7b4fc9" font-weight="bold">Gravity (G has units): u = 1/g, step u → u ∘ₖ s with k = −g*</text>
