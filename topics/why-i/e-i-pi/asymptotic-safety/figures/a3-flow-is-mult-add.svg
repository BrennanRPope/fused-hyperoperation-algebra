<text x="80.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Ours (checks A2–A5): with β(g) = (d − 2) g − w g², u = 1/g obeys du/dt = −(d − 2) u + w, so each RG step is u ∘ₖ s(t) = u + s + k u s with k = −g*.</text>
<text x="80.0" y="456.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Steps compose by the same rule, the wall is the UV fixed point, and RG time is the flat coordinate log|1 + ku|/k.</text>
<text x="80.0" y="473.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">The rate d − 2 is G's canonical units: as d → 2 the dial k = −g* → 0 and gravity's flow becomes the plain-addition flow below.</text>
<text x="80.0" y="490.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Limit: exact for this one-loop shape; the full Einstein–Hilbert flow is two-dimensional (picture a5).</text>
