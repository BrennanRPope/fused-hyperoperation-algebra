<text x="1083.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#8a8a8a" font-weight="normal">← toward high energy (each arrow = the same RG time)</text>
<text x="1100.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#8a8a8a" font-weight="normal">u → ∞: g → 0, the Gaussian point (free gravitons)</text>
<text x="80.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#2e9e5b" font-weight="bold">A dimensionless coupling (QCD-like, check R2): 1/α steps by plain addition, k = 0, no wall</text>
