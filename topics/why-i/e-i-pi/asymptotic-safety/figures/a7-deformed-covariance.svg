<text x="1022.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2a6fdb" font-weight="normal">δK = 0</text>
<text x="908.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">quarter turn: β = 0</text>
<text x="810.6" y="145.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#d0443a" font-weight="normal">Euclidean</text>
<text x="900.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">β = cos(2δK): the real part of a turn</text>
<text x="900.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">the signature flips at a quarter turn</text>
<text x="100.0" y="548.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Known: Bojowald–Paily 2012; Bojowald–Mielczarek 2015 (β, signature change); Ashtekar–Pawlowski–Singh (ρ_c, bounce). Physical status debated.</text>
<text x="100.0" y="563.6" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Reading (ours): β is the lift 1 + kρ with k = −2/ρ_c ∝ G²ħ. The slot it deforms is the signature (c's direction); G only places the wall. Checks B1–B4.</text>
