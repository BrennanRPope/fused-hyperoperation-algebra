<text x="117.7" y="319.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2a6fdb" font-weight="normal">β = 1 − 2ρ/ρ_c &gt; 0: Lorentzian</text>
<text x="117.7" y="393.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">β &lt; 0: Euclidean (four space directions, no time)</text>
<text x="407.0" y="256.8" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">wall: β = 0, the Carroll point</text>
<text x="430.7" y="94.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2e9e5b" font-weight="normal">H² ∝ ρ(1 − ρ/ρ_c), bounce at ρ_c</text>
