<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="640" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Is G a deformation of a spacetime made of anomalous dimensions? Claim by claim</text>
<rect x="30.0" y="70.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="103.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Units form a lattice; natural units collapse it</text>
<rect x="800.0" y="82.0" width="340.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known</text>
<text x="45.0" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">A quantity's units can change with scale (anomalous dimension)</text>
<rect x="800.0" y="136.0" width="340.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known</text>
<rect x="30.0" y="178.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">At the fixed point η_N = −2: G is dimensionless and spacetime looks 2D</text>
<rect x="800.0" y="190.0" width="340.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known, if the fixed point exists</text>
<text x="45.0" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">G (with Λ) labels the trajectory that flows from that spacetime to 4D GR</text>
<rect x="800.0" y="244.0" width="340.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="264.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known RG reading</text>
<rect x="30.0" y="286.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">The label is one pure number, GħΛ/c³, the same as in g-dials</text>
<rect x="800.0" y="298.0" width="340.0" height="30.0" rx="6" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known in substance; link ours</text>
<text x="45.0" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">That flow is a deformation in the Inönü–Wigner / rigidity sense</text>
<rect x="800.0" y="352.0" width="340.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">a stretch: no algebra, no H² test</text>
<rect x="30.0" y="394.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">In 1/g the one-loop flow is exactly mult-add; the wall is the fixed point</text>
<rect x="800.0" y="406.0" width="340.0" height="30.0" rx="6" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">ours, exact for that shape</text>
<text x="45.0" y="481.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Dimension flows (AS, CDT, Calcagni) are exact two-wall rapidity curves</text>
<rect x="800.0" y="460.0" width="340.0" height="30.0" rx="6" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">ours, exact for the published forms</text>
<rect x="30.0" y="502.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="535.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Deformed covariance bends a G-dependent structure</text>
<rect x="800.0" y="514.0" width="340.0" height="30.0" rx="6" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">known; but its dial is the signature</text>
<text x="45.0" y="589.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Either supplies the area law's 1/4</text>
<rect x="800.0" y="568.0" width="340.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="970.0" y="588.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">no</text>
<text x="45.0" y="625.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Green: established in the literature. Orange: established pieces with a caveat or our link. Purple: ours. Red: not supported.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
