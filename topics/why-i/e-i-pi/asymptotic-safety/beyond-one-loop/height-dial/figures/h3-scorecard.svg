<text x="800.0" y="329.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">One match from one free</text>
<text x="800.0" y="346.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">parameter, zero after that.</text>
<text x="120.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Known: published exponents. Ours: the s* prediction θ = 2 ln e_s* = 23/11 applied to each. Checks H4, H5, H12.</text>
