<text x="800.0" y="211.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="800.0" y="228.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">The full Einstein–Hilbert</text>
