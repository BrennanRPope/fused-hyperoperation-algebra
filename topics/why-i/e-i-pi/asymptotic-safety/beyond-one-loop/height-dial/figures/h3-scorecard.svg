<text x="800.0" y="262.1" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">height gives a real number, and</text>
<text x="800.0" y="279.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">a complex height can't keep G</text>
<text x="800.0" y="295.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">real (see README §3).</text>
