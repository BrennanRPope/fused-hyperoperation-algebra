<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="660" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Does G's running stay the circle operation beyond one loop? Claim by claim</text>
<rect x="30.0" y="62.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Bonanno–Reuter's G(k) = G0/(1 + ωG0k²) is exactly the circle op, k = −g*</text>
<rect x="790.0" y="74.0" width="350.0" height="30.0" rx="6" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">exact; it is the one-loop solution</text>
<text x="45.0" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">The test: θ_UV/(d − 2) = 1, coordinate-free</text>
<rect x="790.0" y="128.0" width="350.0" height="30.0" rx="6" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">ours (standard Möbius + linearisation)</text>
<rect x="30.0" y="170.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">EH, Litim, λ = 0: θ = 23/11, ratio 23/22</text>
<rect x="790.0" y="182.0" width="350.0" height="30.0" rx="6" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">broken by 4.5%, set by B₂ (ours)</text>
<text x="45.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Two loops in 2 + ε: θ = ε + (3/5)ε² + …</text>
<rect x="790.0" y="236.0" width="350.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">broken at order ε (ours from AK's β)</text>
<rect x="30.0" y="278.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="311.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">A new flat coordinate makes it a circle op again</text>
<rect x="790.0" y="290.0" width="350.0" height="30.0" rx="6" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">only by turning the wall into a corner</text>
<text x="45.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">The plane dial d can absorb the correction</text>
<rect x="790.0" y="344.0" width="350.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">no: d keeps the exponents ±r</text>
<rect x="30.0" y="386.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="419.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Large N: 1/g and Λ/G are two decoupled circle ops, rates d − 2 and d</text>
<rect x="790.0" y="398.0" width="350.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">ours, exact (exponents known: DEP)</text>
<text x="45.0" y="473.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Pure gravity (g, λ): Λ as a second circle-op dial</text>
<rect x="790.0" y="452.0" width="350.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="472.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">impossible: complex pair (ours)</text>
<rect x="30.0" y="494.0" width="1120.0" height="54.0" rx="0" stroke="none" fill="#f5f6f8" stroke-width="1.2" opacity="1"/>
<text x="45.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">A new testable prediction</text>
<rect x="790.0" y="506.0" width="350.0" height="30.0" rx="6" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">none: it is Sakharov-type running, rewritten</text>
<text x="45.0" y="581.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="normal">Worth keeping as a lens</text>
<rect x="790.0" y="560.0" width="350.0" height="30.0" rx="6" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.18"/>
<text x="965.0" y="580.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">yes: a clean 1/N-and-B₂ diagnostic</text>
<text x="45.0" y="638.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Blue/green: holds exactly. Purple: our test. Orange: holds only in part. Red: does not hold.</text>
