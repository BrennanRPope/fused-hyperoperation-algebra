<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1180" height="600" fill="white"/>
<text x="590.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">One coordinate-free number decides it: the UV exponent θ divided by G's units d − 2</text>
<text x="455.0" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">One-loop shape (Weinberg 1979)</text>
<rect x="470.0" y="87.0" width="93.3" height="26.0" rx="4" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.35"/>
<text x="571.3" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">exact circle op</text>
<text x="455.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Bonanno–Reuter closed form G0/(1 + ωG0k²)</text>
<rect x="470.0" y="147.0" width="93.3" height="26.0" rx="4" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.35"/>
<text x="571.3" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">exact circle op (it is the one-loop solution)</text>
<text x="455.0" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Large N matter, g direction (Donà–Eichhorn–Percacci)</text>
<rect x="470.0" y="207.0" width="93.3" height="26.0" rx="4" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.2" opacity="0.35"/>
<text x="571.3" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">exact; and Λ/G is a second one at rate d</text>
<text x="455.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">EH, Litim cutoff, λ = 0</text>
<rect x="470.0" y="267.0" width="135.8" height="26.0" rx="4" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.2" opacity="0.35"/>
<text x="613.8" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">23/22: off by 4.5%, set by B₂</text>
<text x="455.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Bonanno–Reuter's own β (their cutoff)</text>
<rect x="470.0" y="327.0" width="261.3" height="26.0" rx="4" stroke="#e07b1a" fill="#e07b1a" stroke-width="1.2" opacity="0.35"/>
<text x="739.3" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">ω′/ω = 1.18: off by 18%</text>
<text x="455.0" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Two loops in 2 + ε, at ε = 2 (Aida–Kitazawa)</text>
<rect x="470.0" y="387.0" width="479.0" height="26.0" rx="4" stroke="#d0443a" fill="#d0443a" stroke-width="1.2" opacity="0.35"/>
<text x="957.0" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">1.41: off at order ε</text>
<text x="455.0" y="465.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Full EH (g, λ), pure gravity</text>
<text x="572.7" y="465.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7b4fc9" font-weight="bold">complex 1.475 ± 3.043i: no circle-op form at all</text>
<line x1="563.3" y1="65.0" x2="563.3" y2="490.0" stroke="#222222" stroke-width="2" stroke-dasharray="6,4" opacity="1"/>
<text x="563.3" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">= 1: circle op holds with both ends as true walls</text>
<text x="470.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">0.9</text>
<text x="563.3" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1</text>
<text x="656.7" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1.1</text>
<text x="750.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1.2</text>
<text x="843.3" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1.3</text>
<text x="936.7" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1.4</text>
<text x="1030.0" y="510.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">1.5</text>
<text x="750.0" y="532.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">θ / (d − 2)</text>
<text x="60.0" y="560.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">Why this number: a circle-op (Möbius) flow always has exponents +r and −r at its two walls, whatever the dials k and d (check T1). Smooth changes</text>
<text x="60.0" y="575.6" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#8a8a8a" font-weight="normal">of coordinate cannot change exponents. So θ_UV = d − 2 is necessary and, on the interval, sufficient (1-D linearisation). Checks P1–P6, T1–T6, L5.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
