<svg viewBox="0 0 760 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f3t" xmlns:c2pa="http://c2pa.org/manifest"><title id="f3t">The leftover is the same set at double size, which is itself mostly explained, leaving a smaller leftover at four times the size, and so on. In dimension 1 the pieces are one half, one quarter, one eighth; in dimension 2 three quarters, three sixteenths and so on.</title>
<text x="10" y="30" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#14161c">dimension 1 (naturals by size)</text>
<rect x="10.0" y="40" width="370.0" height="44" fill="#1d4fd8" stroke="#fff" stroke-width="1"/>
<text x="18.0" y="60" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">size ×1</text><text x="18.0" y="77" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#fff">50.0%</text>
<rect x="380.0" y="40" width="185.0" height="44" fill="#3f6fe6" stroke="#fff" stroke-width="1"/>
<text x="388.0" y="60" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">size ×2</text><text x="388.0" y="77" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#fff">25.0%</text>
<rect x="565.0" y="40" width="92.5" height="44" fill="#6a90ee" stroke="#fff" stroke-width="1"/>
<text x="573.0" y="60" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">size ×4</text><text x="573.0" y="77" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#fff">12.5%</text>
<rect x="657.5" y="40" width="46.2" height="44" fill="#97b3f4" stroke="#fff" stroke-width="1"/>
<rect x="703.8" y="40" width="23.1" height="44" fill="#c0d1f8" stroke="#fff" stroke-width="1"/>
<rect x="726.9" y="40" width="11.6" height="44" fill="#dbe5fb" stroke="#fff" stroke-width="1"/>
<rect x="738.4" y="40" width="5.8" height="44" fill="#e9effc" stroke="#fff" stroke-width="1"/>
<rect x="744.2" y="40" width="2.9" height="44" fill="#f2f6fd" stroke="#fff" stroke-width="1"/>
<text x="10" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#5b5f6b">each rung is mult-add on dials t, t², t⁴, …; the first rung alone explains 1 − 1/2 = 50.0%</text>
<text x="10" y="160" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#14161c">dimension 2 (lattice in a plane)</text>
<rect x="10.0" y="170" width="555.0" height="44" fill="#1d4fd8" stroke="#fff" stroke-width="1"/>
<text x="18.0" y="190" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">size ×1</text><text x="18.0" y="207" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#fff">75.0%</text>
<rect x="565.0" y="170" width="138.8" height="44" fill="#3f6fe6" stroke="#fff" stroke-width="1"/>
<text x="573.0" y="190" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">size ×2</text><text x="573.0" y="207" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#fff">18.8%</text>
<rect x="703.8" y="170" width="34.7" height="44" fill="#6a90ee" stroke="#fff" stroke-width="1"/>
<rect x="738.4" y="170" width="8.7" height="44" fill="#97b3f4" stroke="#fff" stroke-width="1"/>
<text x="10" y="236" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#5b5f6b">each rung is mult-add on dials t, t², t⁴, …; the first rung alone explains 1 − 1/4 = 75.0%</text>
