<svg viewBox="0 0 900 508" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f2t" xmlns:c2pa="http://c2pa.org/manifest"><title id="f2t">For each set, the share that mult-add with dials explains (blue) and what is left over: repetition (orange), the class group (purple), or no foothold at all (grey).</title>
