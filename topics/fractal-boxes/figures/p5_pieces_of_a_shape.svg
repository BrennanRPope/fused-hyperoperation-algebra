<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Pieces of a shape and the half step between" xmlns:c2pa="http://c2pa.org/manifest"><title>Pieces of a shape and the half step between</title><rect width="760" height="360" fill="#fff"/><g style="font-family:Inter,system-ui,sans-serif"><text x="20.0" y="28.0" font-size="14" fill="#15131a" text-anchor="start" font-weight="600" >The power set of a shape is the space of all its pieces</text><text x="30.0" y="58.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400" >At one scale the shape looks like 3 points …</text><circle cx="50" cy="84" r="6" fill="#1d2bd8"/><circle cx="80" cy="84" r="6" fill="#1d2bd8"/><circle cx="110" cy="84" r="6" fill="#1d2bd8"/><text x="30.0" y="130.0" font-size="12" fill="#5d5a66" text-anchor="start" font-weight="400" >… so its pieces look like 2³ − 1 = 7 points:</text><rect x="30.00" y="150.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="45" cy="164" r="5" fill="#cf3519"/><circle cx="65" cy="164" r="5" fill="#eeeef2"/><circle cx="85" cy="164" r="5" fill="#eeeef2"/><rect x="108.00" y="150.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="123" cy="164" r="5" fill="#eeeef2"/><circle cx="143" cy="164" r="5" fill="#cf3519"/><circle cx="163" cy="164" r="5" fill="#eeeef2"/><rect x="186.00" y="150.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="201" cy="164" r="5" fill="#eeeef2"/><circle cx="221" cy="164" r="5" fill="#eeeef2"/><circle cx="241" cy="164" r="5" fill="#cf3519"/><rect x="264.00" y="150.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="279" cy="164" r="5" fill="#cf3519"/><circle cx="299" cy="164" r="5" fill="#cf3519"/><circle cx="319" cy="164" r="5" fill="#eeeef2"/><rect x="30.00" y="190.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="45" cy="204" r="5" fill="#cf3519"/><circle cx="65" cy="204" r="5" fill="#eeeef2"/><circle cx="85" cy="204" r="5" fill="#cf3519"/><rect x="108.00" y="190.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="123" cy="204" r="5" fill="#eeeef2"/><circle cx="143" cy="204" r="5" fill="#cf3519"/><circle cx="163" cy="204" r="5" fill="#cf3519"/><rect x="186.00" y="190.00" width="70.00" height="28.00" fill="#fff" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><circle cx="201" cy="204" r="5" fill="#cf3519"/><circle cx="221" cy="204" r="5" fill="#cf3519"/><circle cx="241" cy="204" r="5" fill="#cf3519"/><text x="30.0" y="260.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400" >Pieces of a shape seen at one scale = all subsets of what</text><text x="30.0" y="277.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400" >you see there. Geometry's own power set, scale by scale.</text><text x="30.0" y="305.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="600" >A half step would need h(h(N)) = 2^N on these counts.</text><text x="30.0" y="322.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400" >Products, unions and stretching only change counts</text><text x="30.0" y="339.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="400" >linearly in size, so they can never get there twice.</text><rect x="420.00" y="60.00" width="310.00" height="240.00" fill="none" stroke="#d9d8e0" stroke-width="1" fill-opacity="1"/><text x="420.0" y="50.0" font-size="12" fill="#15131a" text-anchor="start" font-weight="600" >count N of the shape → count of the new space</text><line x1="420.00" y1="300.00" x2="730.00" y2="300.00" stroke="#d9d8e0" stroke-width="0.6"/><text x="414.0" y="304.0" font-size="10" fill="#5d5a66" text-anchor="end" font-weight="400" >2^0</text><line x1="420.00" y1="243.53" x2="730.00" y2="243.53" stroke="#d9d8e0" stroke-width="0.6"/><text x="414.0" y="247.5" font-size="10" fill="#5d5a66" text-anchor="end" font-weight="400" >2^8</text><line x1="420.00" y1="187.06" x2="730.00" y2="187.06" stroke="#d9d8e0" stroke-width="0.6"/><text x="414.0" y="191.1" font-size="10" fill="#5d5a66" text-anchor="end" font-weight="400" >2^16</text><line x1="420.00" y1="130.59" x2="730.00" y2="130.59" stroke="#d9d8e0" stroke-width="0.6"/><text x="414.0" y="134.6" font-size="10" fill="#5d5a66" text-anchor="end" font-weight="400" >2^24</text><line x1="420.00" y1="74.12" x2="730.00" y2="74.12" stroke="#d9d8e0" stroke-width="0.6"/><text x="414.0" y="78.1" font-size="10" fill="#5d5a66" text-anchor="end" font-weight="400" >2^32</text><text x="420.0" y="316.0" font-size="10" fill="#5d5a66" text-anchor="middle" font-weight="400" >2</text><text x="497.5" y="316.0" font-size="10" fill="#5d5a66" text-anchor="middle" font-weight="400" >10</text><text x="575.0" y="316.0" font-size="10" fill="#5d5a66" text-anchor="middle" font-weight="400" >18</text><text x="652.5" y="316.0" font-size="10" fill="#5d5a66" text-anchor="middle" font-weight="400" >26</text><text x="730.0" y="316.0" font-size="10" fill="#5d5a66" text-anchor="middle" font-weight="400" >34</text><text x="575.0" y="332.0" font-size="11" fill="#5d5a66" text-anchor="middle" font-weight="400" >N</text><polyline fill="none" stroke="#15131a" stroke-width="2" points="420.0,292.9 429.7,288.8 439.4,285.9 449.1,283.6 458.8,281.8 468.4,280.2 478.1,278.8 487.8,277.6 497.5,276.6 507.2,275.6 516.9,274.7 526.6,273.9 536.2,273.1 545.9,272.4 555.6,271.8 565.3,271.1 575.0,270.6 584.7,270.0 594.4,269.5 604.1,269.0 613.8,268.5 623.4,268.1 633.1,267.6 642.8,267.2 652.5,266.8 662.2,266.4 671.9,266.1 681.6,265.7 691.2,265.4 700.9,265.0 710.6,264.7 720.3,264.4 730.0,264.1"/><polyline fill="none" stroke="#cf3519" stroke-width="2" points="420.0,285.9 429.7,278.8 439.4,271.8 449.1,264.7 458.8,257.6 468.4,250.6 478.1,243.5 487.8,236.5 497.5,229.4 507.2,222.4 516.9,215.3 526.6,208.2 536.2,201.2 545.9,194.1 555.6,187.1 565.3,180.0 575.0,172.9 584.7,165.9 594.4,158.8 604.1,151.8 613.8,144.7 623.4,137.6 633.1,130.6 642.8,123.5 652.5,116.5 662.2,109.4 671.9,102.4 681.6,95.3 691.2,88.2 700.9,81.2 710.6,74.1 720.3,67.1 730.0,60.0"/><polyline fill="none" stroke="#1d2bd8" stroke-width="2" points="420.0,288.8 429.7,285.9 439.4,278.8 449.1,277.6 458.8,276.6 468.4,275.6 478.1,271.8 487.8,264.7 497.5,257.6 507.2,250.6 516.9,250.5 526.6,250.4 536.2,250.4 545.9,250.3 555.6,243.5 565.3,243.5 575.0,243.5 584.7,243.4 594.4,243.4 604.1,243.3 613.8,243.3 623.4,243.3 633.1,243.2 642.8,243.2 652.5,243.1 662.2,243.1 671.9,243.1 681.6,243.0 691.2,243.0 700.9,242.9 710.6,236.5 720.3,236.5 730.0,236.4"/><polyline fill="none" stroke="#1d2bd8" stroke-width="2" stroke-dasharray="5 4" points="420.0,288.8 429.7,285.9 439.4,278.8 449.1,274.7 458.8,271.8 468.4,269.5 478.1,271.8 487.8,267.6 497.5,266.1 507.2,264.7 516.9,264.7 526.6,263.5 536.2,262.4 545.9,261.5 555.6,257.6 565.3,257.0 575.0,256.4 584.7,255.9 594.4,250.6 604.1,250.3 613.8,250.0 623.4,249.7 633.1,236.5 642.8,236.4 652.5,236.3 662.2,236.2 671.9,229.4 681.6,229.4 691.2,229.3 700.9,229.3 710.6,215.3 720.3,215.3 730.0,215.3"/><text x="691.2" y="260.5" font-size="11" fill="#15131a" text-anchor="middle" font-weight="400" >same shape (N)</text><text x="536.2" y="180.0" font-size="11" fill="#cf3519" text-anchor="middle" font-weight="400" >all pieces (2^N)</text><text x="604.1" y="197.6" font-size="11" fill="#1d2bd8" text-anchor="middle" font-weight="400" >two different</text><text x="604.1" y="210.4" font-size="11" fill="#1d2bd8" text-anchor="middle" font-weight="400" >half steps</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>