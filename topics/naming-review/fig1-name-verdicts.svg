<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="560" fill="#ffffff"/>
<text x="450" y="32" font-size="20" text-anchor="middle" font-weight="bold">DRAFT · Figure 1. Every name, checked against the repo (Nov 28, 2026)</text>
<text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">Green = keep · Amber = small fix suggested · nothing dropped. Nothing has been renamed.</text>
<g font-size="15">
<text x="40" y="96" font-weight="bold">The algebra layer (stands alone)</text>
<rect x="40" y="108" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="52" y="130">Fused Hyperoperation Algebra: yes, an algebra</text>
<rect x="40" y="148" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="52" y="170">circle operation a ∘ₖ b = a + b + k·ab</text>
<rect x="40" y="188" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="52" y="210">rung n = Goodstein's hyperoperation Hₙ</text>
<rect x="40" y="228" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="52" y="250">wall −1/k = the absorbing element</text>
<rect x="40" y="268" width="390" height="34" rx="6" fill="#ffe0b2"/><text x="52" y="290">height s: letter s also means ζ's s and r^s</text>
<rect x="40" y="308" width="390" height="34" rx="6" fill="#ffe0b2"/><text x="52" y="330">hypernatural log: "hypernatural" = *ℕ elsewhere</text>
<text x="470" y="96" font-weight="bold">The theory layer (built on the algebra)</text>
<rect x="470" y="108" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="482" y="130">Affine Composition Theory (math sense: earned)</text>
<rect x="470" y="148" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="482" y="170">dials k homothety, d curvature, p ℓp exponent</text>
<rect x="470" y="188" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="482" y="210">dials t odds, r similarity ratio, q order</text>
<rect x="470" y="228" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="482" y="250">settings in, readings out (Δ, −Δ/4, D, ω)</text>
<rect x="470" y="268" width="390" height="34" rx="6" fill="#c8e6c9"/><text x="482" y="290">"framework" for the whole project</text>
<rect x="470" y="308" width="390" height="34" rx="6" fill="#ffe0b2"/><text x="482" y="330">which name the repo and citation carry</text>
</g>
<text x="40" y="384" font-size="15" font-weight="bold">Why it is an algebra, in one picture: the shift x ↦ 1 + x</text>
<g font-size="15">
<rect x="40" y="398" width="330" height="120" rx="8" fill="#e3f2fd"/>
<text x="205" y="426" text-anchor="middle" font-weight="bold">Ordinary numbers</text>
<text x="205" y="456" text-anchor="middle">add  X + Y</text>
<text x="205" y="482" text-anchor="middle">multiply  X · Y</text>
<text x="205" y="506" text-anchor="middle" font-size="12" fill="#555">a ring: the real numbers</text>
<rect x="530" y="398" width="330" height="120" rx="8" fill="#e3f2fd"/>
<text x="695" y="426" text-anchor="middle" font-weight="bold">Fused numbers</text>
<text x="695" y="456" text-anchor="middle">rung 1  a + b + 1</text>
<text x="695" y="482" text-anchor="middle">rung 2  a ∘ b = a + b + ab</text>
<text x="695" y="506" text-anchor="middle" font-size="12" fill="#555">the same ring, moved over by one</text>
<line x1="380" y1="446" x2="520" y2="446" stroke="#333" stroke-width="2"/><polygon points="520,440 532,446 520,452" fill="#333"/>
<text x="450" y="436" text-anchor="middle" font-size="13">X = 1 + a</text>
<line x1="520" y1="480" x2="380" y2="480" stroke="#333" stroke-width="2"/><polygon points="380,474 368,480 380,486" fill="#333"/>
<text x="450" y="500" text-anchor="middle" font-size="13">a = X − 1</text>
</g>
<text x="450" y="548" font-size="12" text-anchor="middle" fill="#555">Backed by semiring-audit/ (Foundations/RungOneSemiring.lean) and hyperoperation-ladder/ (HyperLadder.lean, 80 theorems).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
