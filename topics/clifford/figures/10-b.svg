</style><title>Dual numbers: mult-add analog</title><text x="14.0" y="24.0" text-anchor="start" class="tt">Mult-add carries its derivative</text><text x="20.0" y="76.0" text-anchor="start">(a₀ + a₁ε) ✳ (b₀ + b₁ε) =</text><text x="20.0" y="106.0" text-anchor="start" class="mt">a₀ ✳ b₀</text><text x="20.0" y="136.0" text-anchor="start">+ (a₁(1 + b₀) + b₁(1 + a₀)) ε</text><text x="14.0" y="210.0" text-anchor="start" class="sm mt">border country = re-charted dual numbers</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>