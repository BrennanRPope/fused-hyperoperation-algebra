</style><title>Biquaternions and Clifford's ω: mult-add analog</title><text x="14.0" y="24.0" text-anchor="start" class="tt">θ is Clifford's (1 + ω)/2</text><circle cx="80.0" cy="112.0" r="40.0" class="m"/><circle cx="80.0" cy="112.0" r="40.0" class="kt"/><path d="M40,112 L120,112" class="dash"/><text x="80.0" y="102.0" text-anchor="middle" class="sm mt">left</text><text x="80.0" y="132.0" text-anchor="middle" class="sm">right</text><text x="150.0" y="90.0" text-anchor="start" class="sm">elliptic motion</text><text x="150.0" y="110.0" text-anchor="start" class="sm">= left half × right half</text><text x="150.0" y="140.0" text-anchor="start" class="sm mt">θ² = θ: the left</text><text x="150.0" y="160.0" text-anchor="start" class="sm mt">projector</text><text x="14.0" y="210.0" text-anchor="start" class="sm">the coefficient ring is our theta-lift, q = −ω²</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>