</style><title>Hamilton's quaternions: mult-add analog</title><text x="14.0" y="24.0" text-anchor="start" class="tt">The q = +1 dial boost</text><rect x="30" y="54" width="120" height="70" rx="6" class="pl"/><text x="90.0" y="82.0" text-anchor="middle">[ 1    u ]</text><text x="90.0" y="106.0" text-anchor="middle">[ −ū   1 ]</text><text x="170.0" y="92.0" text-anchor="start" class="mt">= 1 + u j</text><text x="20.0" y="160.0" text-anchor="start" class="sm">product's corner:</text><text x="20.0" y="182.0" text-anchor="start">(1 − u·v)  +  i (u×v)</text><text x="14.0" y="214.0" text-anchor="start" class="sm mt">scalar = dot, i-part = twist</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>