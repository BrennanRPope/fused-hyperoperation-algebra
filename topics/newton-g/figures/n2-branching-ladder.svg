<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1000" height="400" fill="white"/>
<text x="500.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">One scheme-free number, rho, places every 'double fixed point' flow on one ladder</text>
<line x1="70.0" y1="180.0" x2="930.0" y2="180.0" stroke="#999" stroke-width="2" opacity="1"/>
<line x1="101.9" y1="174.0" x2="101.9" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="101.9" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">0</text>
<line x1="261.1" y1="174.0" x2="261.1" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="261.1" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">0.25</text>
<line x1="420.4" y1="174.0" x2="420.4" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="420.4" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">0.5</text>
<line x1="579.6" y1="174.0" x2="579.6" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="579.6" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">0.75</text>
<line x1="738.9" y1="174.0" x2="738.9" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="738.9" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">1</text>
<line x1="898.1" y1="174.0" x2="898.1" y2="186.0" stroke="#999" stroke-width="1.5" opacity="1"/>
<text x="898.1" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">1.25</text>
<circle cx="101.9" cy="180.0" r="7.0" stroke="#2e9e5b" fill="#2e9e5b" stroke-width="1.5" opacity="1"/>
<line x1="101.9" y1="172.0" x2="101.9" y2="134.0" stroke="#2e9e5b" stroke-width="1" opacity="1"/>
<text x="101.9" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e9e5b" font-weight="bold">circle op = geometric offspring</text>
<text x="101.9" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">one loop exactly (Mobius)</text>
<circle cx="314.2" cy="180.0" r="7.0" stroke="#2a6fdb" fill="#2a6fdb" stroke-width="1.5" opacity="1"/>
<line x1="314.2" y1="188.0" x2="314.2" y2="226.0" stroke="#2a6fdb" stroke-width="1" opacity="1"/>
<text x="314.2" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2a6fdb" font-weight="bold">E(x) = e^x - 1 = Poisson(1) branching</text>
<text x="314.2" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">our height flow</text>
<circle cx="484.1" cy="180.0" r="7.0" stroke="#d0443a" fill="#d0443a" stroke-width="1.5" opacity="1"/>
<line x1="484.1" y1="172.0" x2="484.1" y2="134.0" stroke="#d0443a" stroke-width="1" opacity="1"/>
<text x="484.1" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d0443a" font-weight="bold">2D gravity, c = 0 (t = ln k)</text>
<text x="484.1" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">Aida-Kitazawa two loops</text>
<circle cx="738.9" cy="180.0" r="7.0" stroke="#7b4fc9" fill="#7b4fc9" stroke-width="1.5" opacity="1"/>
<line x1="738.9" y1="188.0" x2="738.9" y2="226.0" stroke="#7b4fc9" stroke-width="1" opacity="1"/>
<text x="738.9" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7b4fc9" font-weight="bold">binary splitting</text>
<text x="738.9" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">0 or 2 children</text>
<circle cx="866.3" cy="180.0" r="7.0" stroke="#d9a400" fill="#d9a400" stroke-width="1.5" opacity="1"/>
<line x1="866.3" y1="172.0" x2="866.3" y2="134.0" stroke="#d9a400" stroke-width="1" opacity="1"/>
<text x="866.3" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d9a400" font-weight="bold">2D gravity if t = ln k^2</text>
<text x="866.3" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">same physics, other clock</text>
<text x="500.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">rho = -b1/b0^2 of the flow; for critical branching rho = 1 - 2 f'''(1) / (3 sigma^4)  (ours to state; parts known)</text>
<text x="500.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">Exponent at the other fixed point: theta = eps + rho eps^2, with eps the rate at the free end (d - 2 for gravity)</text>
<text x="500.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d0443a" font-weight="normal">Same shape everywhere; the SIZE of rho only compares once you fix the clock (one height = ? e-folds of energy)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
