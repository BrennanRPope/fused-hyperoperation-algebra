<text x="44.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" transform="rotate(-90 44.0 220.0)">horn-map size (log scale)</text>
<text x="470.8" y="351.8" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7b4fc9" font-weight="normal">purple line: maps inside a continuous flow</text>
<text x="690.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Horn sizes from ../parabolic-fingerprints.</text>
<text x="690.0" y="96.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="690.0" y="113.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">A continuous flow has horn size 0.</text>
<text x="690.0" y="130.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">E has 64.153 and no flow</text>
<text x="690.0" y="147.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">(../fractional-steps).</text>
<text x="690.0" y="164.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Its iterates share one Fatou</text>
<text x="690.0" y="181.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">coordinate, so they stay off</text>
<text x="690.0" y="198.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">the line (standard, Ecalle).</text>
<text x="690.0" y="215.2" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="690.0" y="232.1" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">If gravity's beta were an analytic</text>
<text x="690.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">flow, no clock could make E match</text>
<text x="690.0" y="265.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">it, even when the residues agree.</text>
<text x="690.0" y="282.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Caveat: perturbative beta series</text>
<text x="690.0" y="299.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">diverge, so 'analytic' is not proven.</text>
