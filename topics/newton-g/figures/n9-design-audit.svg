<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0" y="0" width="1000" height="470" fill="white"/>
<text x="500.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold">Design-rule audit of the first pass: base dials in, readings out</text>
<rect x="30.0" y="60.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="#eeeeee" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">What the first pass wrote</text>
<rect x="260.0" y="60.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#eeeeee" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Base dial (input)</text>
<rect x="510.0" y="60.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#eeeeee" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Reading (output)</text>
<rect x="760.0" y="60.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="#eeeeee" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Fix</text>
<rect x="30.0" y="118.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">k = -g*</text>
<rect x="260.0" y="118.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#dbe9fb" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">w, dimension n: k = -(n-2)/w</text>
<rect x="510.0" y="118.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#fdebd6" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">g* = 12pi/23, the wall</text>
<rect x="760.0" y="118.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">reworded (A1)</text>
<rect x="30.0" y="176.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">R = g/g* 'probability'</text>
<rect x="260.0" y="176.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#dbe9fb" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">odds t = G0 w k^2</text>
<rect x="510.0" y="176.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#fdebd6" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">share R = t/(1+t)</text>
<rect x="760.0" y="176.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">reworded (A3)</text>
<rect x="30.0" y="234.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Richards p = 23/22</text>
<rect x="260.0" y="234.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#dbe9fb" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">l^p exponent p</text>
<rect x="510.0" y="234.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#fdebd6" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Litim exponent theta = 23/11</text>
<rect x="760.0" y="234.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">p set from a reading: a fit (A2)</text>
<rect x="30.0" y="292.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">rho compared to 3/5</text>
<rect x="260.0" y="292.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#dbe9fb" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">k, d, clock r, matter c</text>
<rect x="510.0" y="292.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#fdebd6" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">rho = 1/3 - 4d/(3k^2)</text>
<rect x="760.0" y="292.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">rho is an output (A4)</text>
<rect x="30.0" y="350.0" width="230.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="38.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">'one height = 5/9 e-fold'</text>
<rect x="260.0" y="350.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#dbe9fb" stroke-width="1.2" opacity="1"/>
<text x="268.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">clock r</text>
<rect x="510.0" y="350.0" width="250.0" height="58.0" rx="0" stroke="#999" fill="#fdebd6" stroke-width="1.2" opacity="1"/>
<text x="518.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">rho per e-fold = (ln r)/3</text>
<rect x="760.0" y="350.0" width="210.0" height="58.0" rx="0" stroke="#999" fill="white" stroke-width="1.2" opacity="1"/>
<text x="768.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#d0443a" font-weight="normal">inverted; correct: 9/5 (Q2)</text>
<text x="30.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Blue: what you choose. Orange: what you read off. Two first-pass slips: a fit was presented beside a reading,</text>
<text x="30.0" y="441.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">and the clock factor was written upside down. Neither changes the verdict.</text>
