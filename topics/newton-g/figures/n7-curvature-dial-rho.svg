<text x="690.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">What the picture says</text>
<text x="690.0" y="96.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="690.0" y="113.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">- rho is a reading of the base dials:</text>
<text x="690.0" y="130.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">  rho = 1/3 - 4d/(3k^2)  (= discriminant/(3k^2))</text>
<text x="690.0" y="147.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">- its sign is the conic's type</text>
<text x="690.0" y="164.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">- sliding the shape dial k with d = 0</text>
<text x="690.0" y="181.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">  keeps rho = 1/3 (a rescaling)</text>
<text x="690.0" y="198.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">- 3/5 is reachable, but only by</text>
<text x="690.0" y="215.2" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">  choosing d = -k^2/5. No named point</text>
<text x="690.0" y="232.1" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">  of the plane sits there.</text>
<text x="690.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">- every sphere-like (ellipse) point</text>
<text x="690.0" y="265.9" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">  has the wrong sign for gravity</text>
<text x="690.0" y="282.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal"></text>
<text x="690.0" y="299.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Checks P1-P8.</text>
