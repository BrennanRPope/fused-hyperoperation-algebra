name = "FusedAlgebraMathlib"
version = "0.1.0"
defaultTargets = ["FusedAlgebra"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The repo has no LICENSE file, so files carry no copyright header.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "FusedAlgebra"
