name = "FusedAlgebraMathlib"
version = "0.1.0"
defaultTargets = ["FusedAlgebra", "ProofComplexity", "MathlibCandidates"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The repo has no LICENSE file, so files carry no copyright header.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "FusedAlgebra"

# The proof-complexity study (topics/proof-complexity/ on main). Same Lean and Mathlib versions.
# Its options match the scratch project it was first compiled in, which used Lean's defaults.
[[lean_lib]]
name = "ProofComplexity"
roots = ["ProofComplexity"]

[lean_lib.leanOptions]
relaxedAutoImplicit = true
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 1

# Files written in Mathlib's style as candidates to send to Mathlib (DRAFT; no PR planned yet).
# MathlibCandidates/README.md lists them. Same options as FusedAlgebra.
[[lean_lib]]
name = "MathlibCandidates"

# The one topic file that imports Mathlib directly (topics/tesseract/TesseractCoords.lean), built
# from where it lives. Not a default target: CI builds it in its own report-only step.
[[lean_lib]]
name = "Tesseract"
srcDir = "../topics/tesseract"
roots = ["TesseractCoords"]
