# Builds the Mathlib version of the library (lean-library-mathlib/: the ported library
# and the proof-complexity study) with Mathlib's prebuilt cache, then checks every theorem uses
# only the standard axioms and no sorry. Main's CI (ci.yml) calls this on every push and pull
# request; it can also be run by hand on any branch, tag or commit ("Run workflow").
# It never tags, releases or touches VERSION.
name: Mathlib build

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Mathlib library and proof complexity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Is there a mathlib port on this ref?
        id: port
        run: |
          if [ -f lean-library-mathlib/lakefile.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No lean-library-mathlib/ on this ref; nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan (Lean's toolchain manager)
        if: steps.port.outputs.present == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download mathlib's prebuilt cache
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake exe cache get

      - name: Build the port
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake build

      - name: Check axioms and sorry
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake env lean Check.lean

      - name: Every original theorem has a row in the port's name tables
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: python3 tools/port_notes.py

      - name: Every "ported" row names a declaration that exists
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake env lean tools/CheckNames.lean

      - name: Tesseract coordinates (topics/tesseract/TesseractCoords.lean, the one topic file that imports Mathlib)
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake build Tesseract
