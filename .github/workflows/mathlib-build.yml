# Builds the mathlib version of the library (lean-library-mathlib/) on GitHub,
# using mathlib's prebuilt cache, then checks every theorem uses only the
# standard axioms and no sorry. Runs on pushes and pull requests that touch the
# port, and by hand ("Run workflow") on any branch, such as mathlib-port.
# It never tags, releases or touches VERSION.
name: Mathlib build

on:
  push:
    branches: [main, mathlib-port]
    paths:
      - "lean-library-mathlib/**"
      - ".github/workflows/mathlib-build.yml"
  pull_request:
    paths:
      - "lean-library-mathlib/**"
      - ".github/workflows/mathlib-build.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "mathlib-port"

permissions:
  contents: read

concurrency:
  group: mathlib-build-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Is there a mathlib port on this ref?
        id: port
        run: |
          if [ -f lean-library-mathlib/lakefile.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No lean-library-mathlib/ on this ref; nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan (Lean's toolchain manager)
        if: steps.port.outputs.present == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download mathlib's prebuilt cache
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake exe cache get

      - name: Build the port
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake build

      - name: Check axioms and sorry
        if: steps.port.outputs.present == 'true'
        working-directory: lean-library-mathlib
        run: lake env lean Check.lean
