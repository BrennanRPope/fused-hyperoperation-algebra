# The whole theory, checked on every push and pull request to main.
# Fails loudly if any Lean proof breaks (core library or the Mathlib version), if any theorem uses `sorry` or an axiom beyond
# Lean's standard three, if the assumptions ledger is out of date, or if any topic's
# quick numeric checks fail (the slow numeric runs are in slow-checks.yml, started by hand). It never tags, releases or touches VERSION.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean library (core Lean, no mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (version from lean-library/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-library/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build every module and check axioms (Check.lean)
        run: bash lean-library/build.sh

      - name: Every topic Lean file still builds (known old drafts listed in tools/topic_lean_known.tsv)
        run: python3 tools/topic_lean.py --jobs 4

      - name: Assumptions ledger is current; no sorry, axiom or opaque in the source
        run: python3 tools/assumptions.py --check

      - name: Theorem list is current
        run: |
          if ! cmp -s lean-library/build/theorems.tsv lean-library/theorems.tsv; then
            echo "lean-library/theorems.tsv is out of date: copy build/theorems.tsv over it and run python3 tools/theorems_md.py." >&2
            exit 1
          fi

  checks:
    name: Topic checks (quick, unit-test style, part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-checks.txt

      - name: Install check libraries
        run: python -m pip install -r tools/requirements-checks.txt

      - name: Rebuild data files too large to commit (new-ties dist13.json, 15 MB, read by checks13.py)
        # About 3 minutes on 4 cores, only in the part that runs checks13.py. The repo keeps
        # dist13_summary.json; topics/new-ties/.gitignore keeps the full file out.
        run: |
          if python tools/run_checks.py --quick --shard ${{ matrix.shard }}/3 --list | grep -qx 'topics/new-ties/checks13.py'; then
            cd topics/new-ties && python dist13.py 1000000 4
          else
            echo "checks13.py is not in this part; nothing to rebuild"
          fi

      - name: Run the quick topics/**/checks*.py (and tools/extra_checks.txt) and compare with the saved output
        # Per-push CI keeps to unit-test-style checks (Brennan, Nov 27): the slow numeric runs listed in
        # tools/checks_slow.txt (over about a minute each in CI) run in slow-checks.yml, started by hand.
        # The Lean builds above are the core of CI.
        # Split three ways (Brennan, Nov 27): each job runs every third script, so none is left out.
        # Closed results kept as a one-time record (tools/checks_retired.txt) are not run here or in
        # slow-checks.yml, so CI never shows red on purpose (Brennan, Nov 28).
        run: python tools/run_checks.py --quick --shard ${{ matrix.shard }}/3 --jobs 4 --timeout 600

      - name: Topic write-ups still missing an Assumptions section (report only)
        if: always()
        run: python tools/assumption_sections.py

  mathlib:
    name: Mathlib version (lean-library-mathlib)
    uses: ./.github/workflows/mathlib-build.yml
