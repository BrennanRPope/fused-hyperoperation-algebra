# The whole theory, checked on every push and pull request to main.
# Fails loudly if any Lean proof breaks (core library or the Mathlib version), if any theorem uses `sorry` or an axiom beyond
# Lean's standard three, if the assumptions ledger is out of date, or if any topic's
# numeric checks fail. It never tags, releases or touches VERSION.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean library (core Lean, no mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (version from lean-library/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-library/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build every module and check axioms (Check.lean)
        run: bash lean-library/build.sh

      - name: Every topic Lean file still builds (known old drafts listed in tools/topic_lean_known.tsv)
        run: python3 tools/topic_lean.py --jobs 4

      - name: Assumptions ledger is current; no sorry, axiom or opaque in the source
        run: python3 tools/assumptions.py --check

      - name: Theorem list is current
        run: |
          if ! cmp -s lean-library/build/theorems.tsv lean-library/theorems.tsv; then
            echo "lean-library/theorems.tsv is out of date: copy build/theorems.tsv over it and run python3 tools/theorems_md.py." >&2
            exit 1
          fi

  checks:
    name: Topic checks (numeric evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-checks.txt

      - name: Install check libraries
        run: python -m pip install -r tools/requirements-checks.txt

      - name: Run every topics/**/checks*.py (and tools/extra_checks.txt) and compare with the saved output
        run: python tools/run_checks.py --jobs 4 --timeout 1500

      - name: Topic write-ups still missing an Assumptions section (report only)
        if: always()
        run: python tools/assumption_sections.py

  mathlib:
    name: Mathlib version (lean-library-mathlib)
    uses: ./.github/workflows/mathlib-build.yml
